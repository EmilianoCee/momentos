# Runs every check on each pull request and on pushes to main.
# The same command works on your own machine: python3 scripts/check.py
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every check
        run: python3 scripts/check.py
