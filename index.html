    g.circle = S("circle", { class: "folder" + (g.depth > 1 ? " deep" : "") }, layerFolders);
    g.arc = S("path", { id: id, fill: "none" }, defs);
    g.label = S("text", { class: "folder-label", dy: "0.33em", tabindex: 0, role: "button" }, layerNames);
    g.label.setAttribute("aria-label", "folder " + g.path + ": zoom to it");
    [S("text", { class: "folder-halo", dy: "0.33em" }, layerHalos), g.label].forEach((text) => {
      const tp = S("textPath", { href: "#" + id, startOffset: "50%", "text-anchor": "middle" }, text);
      tp.setAttributeNS(XLINK, "xlink:href", "#" + id);
      tp.textContent = g.name;
    });
    groupOf.set(g.label, g);
  });

  links.forEach((l) => { l.el = S("path", { class: "link" }, layerLinks); });

  // ---------------------------------------------------------------- geometry
  // Smallest circle that contains a set of discs {x, y, r}. It is pinned down by at most
  // three of them, so keep a "basis" of up to three and grow it whenever a disc sticks out
  // (Welzl's idea, in the form Matousek, Sharir and Welzl gave it; d3-hierarchy packs circles the same way).

  function holds(c, d) {
    return Math.hypot(d.x - c.x, d.y - c.y) + d.r <= c.r + 1e-7 * Math.max(1, c.r);
  }
  function pairCircle(a, b) {
    if (holds(a, b)) return { x: a.x, y: a.y, r: a.r };
    if (holds(b, a)) return { x: b.x, y: b.y, r: b.r };
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy);
    const r = (l + a.r + b.r) / 2, t = (r - a.r) / l;
    return { x: a.x + dx * t, y: a.y + dy * t, r: r };
  }
  function tangentCircle(d1, d2, d3) {
    // Solve |c - ci| = R - ri for i = 1..3. Subtracting pairs leaves two equations that are
    // linear in the centre, which gives the centre as (X0 + X1 R, Y0 + Y1 R); one quadratic in R remains.
    const a2 = d2.x - d1.x, b2 = d2.y - d1.y, a3 = d3.x - d1.x, b3 = d3.y - d1.y;
    const det = a2 * b3 - a3 * b2;
    if (Math.abs(det) < 1e-9) return null;
    const p2 = (a2 * a2 + b2 * b2 - d2.r * d2.r + d1.r * d1.r) / 2, q2 = d2.r - d1.r;
    const p3 = (a3 * a3 + b3 * b3 - d3.r * d3.r + d1.r * d1.r) / 2, q3 = d3.r - d1.r;
    const X0 = (p2 * b3 - p3 * b2) / det, X1 = (q2 * b3 - q3 * b2) / det;
    const Y0 = (a2 * p3 - a3 * p2) / det, Y1 = (a2 * q3 - a3 * q2) / det;
    const A = X1 * X1 + Y1 * Y1 - 1;
    const B = 2 * (X0 * X1 + Y0 * Y1 + d1.r);
    const C = X0 * X0 + Y0 * Y0 - d1.r * d1.r;
    const need = Math.max(d1.r, d2.r, d3.r) - 1e-9;
    let R = NaN;
    if (Math.abs(A) < 1e-12) {
      R = -C / B;
    } else {
      const disc = B * B - 4 * A * C;
      if (disc < 0) return null;
      const s = Math.sqrt(disc), r1 = (-B - s) / (2 * A), r2 = (-B + s) / (2 * A);
      const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
      R = lo >= need ? lo : hi;
    }
    if (!(R >= need) || !isFinite(R)) return null;
    return { x: d1.x + X0 + X1 * R, y: d1.y + Y0 + Y1 * R, r: R };
  }
  function looseCircle(discs) {
    let x = 0, y = 0, r = 0;
    for (const d of discs) { x += d.x; y += d.y; }
    x /= discs.length; y /= discs.length;
    for (const d of discs) r = Math.max(r, Math.hypot(d.x - x, d.y - y) + d.r);
    return { x: x, y: y, r: r };
  }
  function smallCircle(s) {
    if (s.length === 1) return { x: s[0].x, y: s[0].y, r: s[0].r };
    if (s.length === 2) return pairCircle(s[0], s[1]);
    const trios = [[s[0], s[1], s[2]], [s[0], s[2], s[1]], [s[1], s[2], s[0]]];
    for (const t of trios) {
      const c = pairCircle(t[0], t[1]);
      if (holds(c, t[2])) return c;
    }
    return tangentCircle(s[0], s[1], s[2]) || looseCircle(s);
  }
  function enclose(discs) {
    const n = discs.length;
    if (!n) return { x: 0, y: 0, r: 0 };
    let basis = [discs[0]], c = smallCircle(basis), i = 1, guard = 0;
    while (i < n) {
      const d = discs[i];
      if (holds(c, d)) { i++; continue; }
      if (++guard > 60 * n + 200) return looseCircle(discs);
      // d sticks out, so it must touch the new circle: try it alone, with one, then with two of the old basis
      const tries = [[d]];
      for (const b of basis) tries.push([b, d]);
      for (let p = 0; p < basis.length; p++) for (let q = p + 1; q < basis.length; q++) tries.push([basis[p], basis[q], d]);
      let next = null;
      for (const t of tries) {
        const k = smallCircle(t);
        if (holds(k, d) && basis.every((b) => holds(k, b))) { next = t; c = k; break; }
      }
      if (!next) return looseCircle(discs);
      basis = next;
      i = 0;
    }
    return c;
  }

  // ---------------------------------------------------------------- layout

  const PAD = 18;            // room between a folder's circle and what is inside it
  const GAP_FOLDERS = 12;    // room between two sibling folders
  const GAP_TOPIC_FOLDER = 6;
  const REST = 60;           // a link only pulls while its ends are further apart than this...
  const REACH = 140;         // ...and never harder than if they were this much further
  const K_BRANCH = 0.1;      // how hard a link pulls whole folders toward each other
  const LEAN = 1.5;          // how far, per round, it nudges a topic toward that side of its own folder
  const K_GATHER = 0.09;     // how hard everything leans toward the middle of its folder
  const ROUNDS = topics.length <= 120 ? 420 : topics.length <= 260 ? 300 : 220;    // a big map gets fewer, since each costs more

  function discsOf(n) {
    if (n.kind === "group") return [{ x: n.x, y: n.y, r: n.R }];
    if (n.hl <= 0) return [{ x: n.x, y: n.y, r: n.r }];
    return [{ x: n.x - n.hl, y: n.y, r: n.r }, { x: n.x + n.hl, y: n.y, r: n.r }];
  }
  function shift(n, dx, dy) {
    n.x += dx; n.y += dy;
    if (n.kind === "group") for (const c of n.children) shift(c, dx, dy);
  }
  // How far b has to move away from a for the two to clear each other (null if they already do).
  function overlap(a, b) {
    let dx, dy, need;
    if (a.kind === "leaf" && b.kind === "leaf") {
      const gap = Math.abs(b.x - a.x) - (a.hl + b.hl);
      dx = gap > 0 ? Math.sign(b.x - a.x) * gap : 0;
      dy = b.y - a.y;
      need = a.r + b.r;
    } else if (a.kind === "group" && b.kind === "group") {
      dx = b.x - a.x; dy = b.y - a.y;
      need = a.R + b.R + GAP_FOLDERS;
    } else {
      const leaf = a.kind === "leaf" ? a : b, grp = a.kind === "leaf" ? b : a;
      const px = clamp(grp.x, leaf.x - leaf.hl, leaf.x + leaf.hl);
      dx = grp.x - px; dy = grp.y - leaf.y;
      if (leaf !== a) { dx = -dx; dy = -dy; }
      need = leaf.r + grp.R + GAP_TOPIC_FOLDER;
    }
    let d = Math.hypot(dx, dy);
    if (d >= need) return null;
    if (d < 1e-6) { dx = 0; dy = 1; d = 1; }   // dead centre: labels are wide, so the short way out is vertical
    const k = (need - d) / d;
    return { x: dx * k, y: dy * k };
  }
  // Bottom-up: push siblings apart, then wrap their folder around them.
  function settle(node, passes) {
    if (node.kind === "leaf") return;
    const cs = node.children;
    for (const c of cs) settle(c, passes);
    for (let p = 0; p < passes; p++) {
      let moved = false;
      for (let i = 0; i < cs.length; i++) {
        for (let j = i + 1; j < cs.length; j++) {
          const v = overlap(cs[i], cs[j]);
          if (!v) continue;
          const wi = cs[j].mass / (cs[i].mass + cs[j].mass), wj = 1 - wi;
          shift(cs[i], -v.x * wi, -v.y * wi);
          shift(cs[j], v.x * wj, v.y * wj);
          moved = true;
        }
      }
      if (!moved) break;
    }
    const e = enclose(cs.reduce((all, c) => all.concat(discsOf(c)), []));
    node.x = e.x; node.y = e.y;
    node.R = e.r + (node === root ? 0 : PAD);
  }

  // ---- how good is an arrangement? (lower is better)

  // does the straight line of link l pass through the words of topic t?
  function runsThrough(l, t) {
    const hw = t.w / 2 + 5, hh = t.h / 2 + 2, dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const edges = [[-dx, l.a.x - (t.x - hw)], [dx, t.x + hw - l.a.x], [-dy, l.a.y - (t.y - hh)], [dy, t.y + hh - l.a.y]];
    let t0 = 0, t1 = 1;
    for (const e of edges) {
      if (e[0] === 0) { if (e[1] < 0) return false; continue; }
      const r = e[1] / e[0];
      if (e[0] < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
      else { if (r < t0) return false; if (r < t1) t1 = r; }
    }
    return true;
  }
  function cross(p, q) {
    if (p.a === q.a || p.a === q.b || p.b === q.a || p.b === q.b) return false;
    const side = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    return side(p.a, p.b, q.a) * side(p.a, p.b, q.b) < 0 && side(q.a, q.b, p.a) * side(q.a, q.b, p.b) < 0;
  }
  // the box around the top-level folders, and the zoom at which it fills the free part of the window
  function extent() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of root.children) {
      const rx = c.kind === "group" ? c.R : c.hl + c.r, ry = c.kind === "group" ? c.R : c.r;
      x0 = Math.min(x0, c.x - rx); x1 = Math.max(x1, c.x + rx);

    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, zoom: Math.min(f.w / (x1 - x0 + 2 * m), f.h / (y1 - y0 + 2 * m)) };
  }
  // A link through somebody else's label is the worst thing a map can do, because it reads as a
  // connection that is not there. After that: how large the map can be drawn in this window
  // (a shape that wastes the window means small text), links crossing each other, and sheer length.
  function quality() {
    let through = 0, crossings = 0, length = 0;
    for (const l of links) {
      length += Math.hypot(l.b.x - l.a.x, l.b.y - l.a.y);
      for (const t of topics) if (t !== l.a && t !== l.b && runsThrough(l, t)) through++;
    }
    for (let i = 0; i < links.length; i++) for (let j = i + 1; j < links.length; j++) if (cross(links[i], links[j])) crossings++;
    const zoom = extent().zoom;
    return { through: through, crossings: crossings, length: length, zoom: zoom, score: through * 1000 + 1500 / zoom + crossings * 40 + length / 50 };
  }

  // ---- one arrangement

  // small seeded generator: the same `seed` always gives the same sequence
  function dice(seed) {
    let a = (seed * 2654435761) >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // `shape` is "wide", "tall" or "square": the top-level folders are gathered harder along the
  // short side of the window, so the map spreads along the long side.
  // `attempt` picks the starting point. 0 fans everything out in the order of the data;
  // every other number shuffles the order and the angles in its own repeatable way.
  function arrange(shape, attempt) {
    const gx = shape === "wide" ? 0.5 : shape === "tall" ? 1.7 : 1;
    const gy = shape === "wide" ? 1.7 : shape === "tall" ? 0.5 : 1;
    const roll = dice(attempt);

    (function seed(node, x, y) {
      node.x = x; node.y = y;
      if (node.kind === "leaf") return;
      const kids = node.children.slice();
      let turn = node.depth * 0.7;
      if (attempt > 0) {
        for (let i = kids.length - 1; i > 0; i--) { const j = Math.floor(roll() * (i + 1)), t = kids[i]; kids[i] = kids[j]; kids[j] = t; }
        turn = roll() * TAU;
      }
      const n = kids.length, spread = 40 * Math.sqrt(node.mass), top = node === root;
      kids.forEach((c, i) => {
        const ang = TAU * (i / n) - Math.PI / 2 + turn;
        const rad = n > 1 ? spread * (0.5 + 0.14 * ((i * 7) % 3)) : 0;
        seed(c, x + (Math.cos(ang) * rad) / (top ? Math.sqrt(gx) : 1), y + (Math.sin(ang) * rad * 0.82) / (top ? Math.sqrt(gy) : 1));
      });
    })(root, 0, 0);
    settle(root, 4);

    function gather(node, k) {
      const top = node === root;
      for (const c of node.children) {
        shift(c, (node.x - c.x) * k * (top ? gx : 1), (node.y - c.y) * k * (top ? gy : 1));
        if (c.kind === "group") gather(c, k);
      }
    }

    // A label that sits on somebody else's link looks connected to it, so labels step aside.
    // The label is treated as the horizontal stroke through the middle of its words.
    function clearLinks(strength) {
      for (const l of links) {
        const ax = l.a.x, ay = l.a.y, bx = l.b.x, by = l.b.y, vx = bx - ax, vy = by - ay, len = Math.hypot(vx, vy);
        if (len < 1) continue;
        for (const t of topics) {
          if (t === l.a || t === l.b) continue;
          const need = t.h / 2 + 9, half = t.w / 2, x0 = t.x - half, x1 = t.x + half, y = t.y;
          if (Math.min(ax, bx) > x1 + need || Math.max(ax, bx) < x0 - need || Math.min(ay, by) > y + need || Math.max(ay, by) < y - need) continue;
          let px = 0, py = 0;
          const xAt = vy !== 0 && (ay - y) * (by - y) <= 0 ? ax + (vx * (y - ay)) / vy : NaN;
          if (xAt >= x0 && xAt <= x1) {
            // the link cuts through the words: step off it sideways, to the side the middle of the label is already on
            const side = vx * (y - ay) - vy * (t.x - ax) >= 0 ? 1 : -1;
            px = (-vy / len) * side * need; py = (vx / len) * side * need;
          } else {
            // not cut, but perhaps too close: back away from the nearest point of the link
            let best = Infinity, fx = 0, fy = 0;
            const consider = (lx, ly, tx, ty) => { const d = Math.hypot(tx - lx, ty - ly); if (d < best) { best = d; fx = tx - lx; fy = ty - ly; } };
            for (const ex of [x0, x1]) {            // each end of the label against the link
              const u = clamp(((ex - ax) * vx + (y - ay) * vy) / (len * len), 0, 1);
              consider(ax + vx * u, ay + vy * u, ex, y);
            }
            consider(ax, ay, clamp(ax, x0, x1), y);    // each end of the link against the label
            consider(bx, by, clamp(bx, x0, x1), y);
            if (best >= need) continue;
            if (best < 1e-6) { fx = -vy; fy = vx; best = len; }
            px = (fx / best) * (need - best); py = (fy / best) * (need - best);
          }
          t.x += px * strength; t.y += py * strength;
        }
      }
    }

    for (let round = 0; round < ROUNDS; round++) {
      const heat = Math.pow(1 - round / ROUNDS, 1.2);

      for (const l of links) {
        const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy);
        if (d <= REST) continue;
        const ux = dx / d, uy = dy / d, pull = Math.min(d - REST, REACH) * heat;
        // the two branches under the folder both ends share move as rigid bodies...
        const ka = (pull * K_BRANCH) / Math.sqrt(l.ga.mass), kb = (pull * K_BRANCH) / Math.sqrt(l.gb.mass);
        shift(l.ga, ux * ka, uy * ka);
        shift(l.gb, -ux * kb, -uy * kb);
        // ...and each topic also leans a little toward its partner inside its own folder
        if (l.ga !== l.a) { l.a.x += ux * LEAN * heat; l.a.y += uy * LEAN * heat; }
        if (l.gb !== l.b) { l.b.x -= ux * LEAN * heat; l.b.y -= uy * LEAN * heat; }
      }

      clearLinks(0.35);
      gather(root, K_GATHER * (0.35 + 0.65 * heat));
      settle(root, 3);
    }
    // squeeze out the slack that is left, then make sure nothing overlaps
    for (let i = 0; i < 90; i++) { clearLinks(0.35); gather(root, 0.03); settle(root, 4); }
    for (let i = 0; i < 6; i++) settle(root, 80);
  }

  // ---- the layout: try several starting points and keep the cleanest result

  function everything(fn) {
    (function walk(n) { fn(n); if (n.kind === "group") n.children.forEach(walk); })(root);
  }
  let chosen = null;     // what quality() said about the arrangement that was kept
  function place(places) {
    let i = 0;
    everything((n) => { n.x = places[i++]; n.y = places[i++]; const R = places[i++]; if (n.kind === "group") n.R = R; });
  }
  function layout(shape) {
    const started = performance.now();
    // The arrangement depends only on the data and the shape of the window, so it is worked out once and kept.
    const slot = "momentos-layout-" + shape;
    try {
      const kept = JSON.parse(localStorage.getItem(slot) || "null");
      let count = 0;
      everything(() => { count++; });
      if (kept && kept.data === dataMark && kept.places.length === count * 3) {
        place(kept.places);
        chosen = { kept: true, ms: Math.round(performance.now() - started) };
        return;
      }
    } catch (_) { /* no storage here, or an entry that cannot be read: work it out again */ }
    const attempts = topics.length <= 40 ? 16 : topics.length <= 90 ? 8 : topics.length <= 200 ? 3 : 1;    // each attempt costs more on a bigger map
    let best = null;
    for (let attempt = 0; attempt < attempts; attempt++) {
      arrange(shape, attempt);
      const q = quality();
      if (best && q.score >= best.q.score) continue;
      const places = [];
      everything((n) => places.push(n.x, n.y, n.R || 0));
      best = { q: q, places: places, attempt: attempt };
    }
    place(best.places);
    chosen = { attempt: best.attempt, through: best.q.through, crossings: best.q.crossings, length: Math.round(best.q.length), zoom: +best.q.zoom.toFixed(2), ms: Math.round(performance.now() - started) };
    try { localStorage.setItem(slot, JSON.stringify({ data: dataMark, places: best.places.map((v) => +v.toFixed(2)) })); } catch (_) { /* not kept: it is worked out again next time */ }
  }

  // ---------------------------------------------------------------- drawing

  // How far along the way to (tx, ty) the centre line leaves the label's own box.
  function exit(leaf, tx, ty) {
    const dx = Math.abs(tx - leaf.x), dy = Math.abs(ty - leaf.y);
    const hw = leaf.w / 2 + 7, hh = leaf.h / 2 + 1;
    return Math.min(dx > 0 ? hw / dx : Infinity, dy > 0 ? hh / dy : Infinity);
  }

  function draw() {
    topics.forEach((t) => {
      t.el.setAttribute("transform", "translate(" + t.x.toFixed(2) + " " + t.y.toFixed(2) + ")");
      const w = t.w + 18, h = t.h + 8;
      t.hit.setAttribute("x", (-w / 2).toFixed(2));
      t.hit.setAttribute("y", (-h / 2).toFixed(2));
      t.hit.setAttribute("width", w.toFixed(2));
      t.hit.setAttribute("height", h.toFixed(2));
      t.hit.setAttribute("rx", (h / 2).toFixed(2));
    });
    groups.forEach((g) => {
      if (g === root) return;
      g.circle.setAttribute("cx", g.x.toFixed(2));
      g.circle.setAttribute("cy", g.y.toFixed(2));
      g.circle.setAttribute("r", g.R.toFixed(2));
      // The name sits on the circle's own line: at the top for a top-level folder, at the bottom for a
      // folder inside another, so that a subfolder's name never lands on its parent's.
      g.arc.setAttribute("d", "M" + (g.x - g.R).toFixed(2) + " " + g.y.toFixed(2) + " A" + g.R.toFixed(2) + " " + g.R.toFixed(2) + " 0 0 " + (g.depth > 1 ? 0 : 1) + " " + (g.x + g.R).toFixed(2) + " " + g.y.toFixed(2));
    });
    bent = 0; overruns = 0;
    links.forEach((l) => {
      const a = l.a, b = l.b, dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
      if (exit(a, b.x, b.y) + exit(b, a.x, a.y) >= 0.98) { l.el.setAttribute("visibility", "hidden"); return; }
      l.el.removeAttribute("visibility");
      // A straight line unless that would run over somebody else's label. Then try gentle bows to
      // either side, the smallest first, and keep the first one that runs over nothing.
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = -dy / len, ny = dx / len;
      let bow = 0, hits = overrun(l, mx, my);
      if (hits) {
        for (const tryBow of BOWS) {
          if (Math.abs(tryBow) > len * 0.45) continue;
          const h = overrun(l, mx + nx * tryBow * 2, my + ny * tryBow * 2);
          if (h < hits) { hits = h; bow = tryBow; if (!h) break; }
        }
      }
      overruns += hits;
      if (!bow) {
        const ta = exit(a, b.x, b.y), tb = exit(b, a.x, a.y);
        l.el.setAttribute("d", "M" + (a.x + dx * ta).toFixed(2) + " " + (a.y + dy * ta).toFixed(2) + "L" + (b.x - dx * tb).toFixed(2) + " " + (b.y - dy * tb).toFixed(2));
        return;
      }
      bent++;
      // the curve leaves each label heading for the control point (the apex of the bow is half way to it)
      const cx = mx + nx * bow * 2, cy = my + ny * bow * 2;
      const ta = exit(a, cx, cy), tb = exit(b, cx, cy);
      l.el.setAttribute("d", "M" + (a.x + (cx - a.x) * ta).toFixed(2) + " " + (a.y + (cy - a.y) * ta).toFixed(2) +
        "Q" + cx.toFixed(2) + " " + cy.toFixed(2) + " " + (b.x + (cx - b.x) * tb).toFixed(2) + " " + (b.y + (cy - b.y) * tb).toFixed(2));
    });
  }

  // How many labels, other than its own two, a link would run over if it were drawn as the curve
  // from a to b that bends toward the control point (cx, cy). The midpoint as control point is a straight line.
  const BOWS = [24, -24, 44, -44, 68, -68, 96, -96, 130, -130];
  let bent = 0, overruns = 0;
  function overrun(l, cx, cy) {
    const a = l.a, b = l.b, steps = clamp(Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 7), 12, 120);
    let hits = 0;
    // the curve stays inside the box round its two ends and its control point
    const x0 = Math.min(a.x, b.x, cx), x1 = Math.max(a.x, b.x, cx), y0 = Math.min(a.y, b.y, cy), y1 = Math.max(a.y, b.y, cy);
    for (const t of topics) {
      if (t === a || t === b) continue;
      const hw = t.w / 2 + 6, hh = t.h / 2 + 3;
      if (t.x + hw < x0 || t.x - hw > x1 || t.y + hh < y0 || t.y - hh > y1) continue;    // nowhere near this link
      for (let i = 1; i < steps; i++) {
        const u = i / steps, v = 1 - u;
        const x = v * v * a.x + 2 * v * u * cx + u * u * b.x, y = v * v * a.y + 2 * v * u * cy + u * u * b.y;
        if (Math.abs(x - t.x) < hw && Math.abs(y - t.y) < hh) { hits++; break; }
      }
    }
    return hits;
  }

  // ---------------------------------------------------------------- view (pan and zoom)

  const K_MIN = 0.12, K_MAX = 6;
  const FAR = 0.5;       // below this zoom a label is under 8px tall, so topics are drawn as dots
  let wasFar = false;
  const view = { x: 0, y: 0, k: 1 };
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let anim = 0;
  let touched = false;   // has the reader moved the view themselves?

  function applyView() {
    world.setAttribute("transform", "translate(" + view.x.toFixed(2) + " " + view.y.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
    // folder names never get smaller than 10.5px on screen
    layerNames.style.fontSize = layerHalos.style.fontSize = (10.5 / Math.min(1, view.k)).toFixed(2) + "px";
    // far away, each topic is a dot of a fixed size on screen
    const far = view.k < FAR;
    svg.style.setProperty("--k", view.k.toFixed(4));
    if (far) { const r = (2.6 / view.k).toFixed(2); topics.forEach((t) => t.dot.setAttribute("r", r)); }
    if (far !== wasFar) { svg.classList.toggle("far", far); wasFar = far; }
  }
  function size() {
    const r = svg.getBoundingClientRect();
    return { w: r.width, h: r.height, left: r.left, top: r.top };
  }
  // the part of the window that is not covered by the header, the footer or the open panel
  function free() {
    const s = size(), wide = s.w > 760, open = !panel.hidden;
    const left = 20, top = 62;
    const right = open && wide ? panel.offsetWidth + 36 : 20;
    const bottom = open && !wide ? panel.offsetHeight + 20 : 54;
    return { x: left, y: top, w: Math.max(120, s.w - left - right), h: Math.max(120, s.h - top - bottom) };
  }
  function frame(cx, cy, r, kMax) {
    const f = free();
    const k = clamp(Math.min(f.w, f.h) / (2 * r), K_MIN, kMax);
    return { k: k, x: f.x + f.w / 2 - cx * k, y: f.y + f.h / 2 - cy * k };
  }
  function stop() { if (anim) cancelAnimationFrame(anim); anim = 0; }
  function go(to, instant) {
    stop();
    if (instant || still) { view.x = to.x; view.y = to.y; view.k = to.k; applyView(); return; }
    const from = { x: view.x, y: view.y, k: view.k }, t0 = performance.now();
    (function step(now) {
      const u = clamp((now - t0) / 420, 0, 1);
      const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      view.x = from.x + (to.x - from.x) * e;
      view.y = from.y + (to.y - from.y) * e;
      view.k = from.k + (to.k - from.k) * e;
      applyView();
      anim = u < 1 ? requestAnimationFrame(step) : 0;
    })(t0);
  }
  function zoomAt(px, py, factor) {
    const k = clamp(view.k * factor, K_MIN, K_MAX), f = k / view.k;
    view.x = px - (px - view.x) * f;
    view.y = py - (py - view.y) * f;
    view.k = k;
    applyView();
  }
  function zoomBy(factor) {
    const f = free(), px = f.x + f.w / 2, py = f.y + f.h / 2;
    const k = clamp(view.k * factor, K_MIN, K_MAX), r = k / view.k;
    touched = true;
    go({ k: k, x: px - (px - view.x) * r, y: py - (py - view.y) * r });
  }
  function fitAll(instant) {
    touched = false;
    const e = extent(), f = free(), k = clamp(e.zoom, K_MIN, 1.8);
    go({ k: k, x: f.x + f.w / 2 - e.cx * k, y: f.y + f.h / 2 - e.cy * k }, instant);
  }
  function fitFolder(g) {
    touched = true;
    go(frame(g.x, g.y, g.R + 14, 2.6));
  }

  // ---------------------------------------------------------------- selection

  let selected = null, hovered = null;

  function paint() {
    const focus = hovered || selected;
    svg.classList.toggle("focused", !!focus);
    topics.forEach((t) => {
      t.el.classList.remove("on", "self");
      t.el.classList.toggle("selected", t === selected);
    });
    links.forEach((l) => l.el.classList.remove("on"));
    if (!focus) return;
    focus.el.classList.add("on", "self");
    focus.out.forEach((l) => { l.el.classList.add("on"); l.b.el.classList.add("on"); });
    focus.inn.forEach((l) => { l.el.classList.add("on"); l.a.el.classList.add("on"); });
  }

  function linkList(title, list, other) {
    if (!list.length) return "";
    return "<h3>" + title + "</h3><ul>" + list.map((l) => {
      const o = other(l);
      return '<li><button type="button" data-go="' + esc(o.id) + '"' + (o.built ? "" : ' class="planned"') + ">" + rich(o.topic.title) + "</button><span>" + rich(l.why) + "</span></li>";
    }).join("") + "</ul>";
  }

  function fillPanel(leaf) {
    const t = leaf.topic, html = [];
    html.push('<p class="p-path">' + esc(t.folder).replace(/\//g, " / ") + "</p>");
    html.push("<h2>" + rich(t.title) + "</h2>");
    if (t.essence) html.push('<p class="p-essence">' + rich(t.essence) + "</p>");
    if (leaf.built && canFollowLinks) {
      html.push('<p class="p-tools">' + t.tools.map((p) => '<a href="' + esc(encodeURI(p)) + '">open the tool: ' + esc(toolName(p)) + ' <span aria-hidden="true">→</span></a>').join("") + "</p>");
    } else if (leaf.built) {
      html.push('<p class="p-tools">' + t.tools.map((p) => "<code>" + esc(p) + "</code>").join("") + "</p>");
      html.push('<p class="p-none">This preview cannot follow links. Open that file directly, or open index.html in a browser.</p>');
    } else if (t.plan) {
      html.push('<p class="p-none">' + (t.plan_status === "planned" ? "No tool yet. Its plan is ready to build:" : "No tool yet. A stub of its plan exists:") + "</p>");
      html.push('<p class="p-tools"><code>' + esc(t.plan) + "</code></p>");
    } else {
      html.push('<p class="p-none">Planned. Nothing in the repo teaches this yet.</p>');
    }
    if (t.check) html.push('<p class="p-check"><span>check yourself</span>' + rich(t.check) + "</p>");
    if (Array.isArray(t.courses) && t.courses.length) html.push('<p class="p-courses">' + t.courses.map(esc).join(" · ") + "</p>");
    if (learner) {
      const mine = learner.levels[leaf.id] || { level: 0 };
      html.push('<p class="p-courses">your level: L' + (mine.level | 0) + (mine.target ? " · target L" + mine.target : "") + (mine.mastered ? " · mastered" : "") + (mine.due ? " · review due" : "") + "</p>");
    }
    html.push(linkList("builds on", leaf.inn, (l) => l.a));
    html.push(linkList("leads to", leaf.out, (l) => l.b));
    if (Array.isArray(t.later) && t.later.length) {
      html.push("<h3>comes back in</h3><ul>" + t.later.map((x) => "<li><b>" + esc(x.course) + "</b><span>" + rich(x.how) + "</span></li>").join("") + "</ul>");
    }
    panelBody.innerHTML = html.join("");
    panel.scrollTop = 0;
  }

  function setHash(id) {
    try { history.replaceState(null, "", "#" + (id || "")); } catch (_) { /* previews without an address */ }
  }

  // bring a topic into the part of the window that is not covered
  function reveal(leaf, always, instant) {
    const f = free();
    const sx = view.x + leaf.x * view.k, sy = view.y + leaf.y * view.k;
    const mx = 30 + (leaf.w * view.k) / 2;
    const seen = sx > f.x + mx && sx < f.x + f.w - mx && sy > f.y + 24 && sy < f.y + f.h - 24;
    if (seen && !always) return;
    const k = always ? Math.max(view.k, 1.15) : view.k;
    go({ k: k, x: f.x + f.w / 2 - leaf.x * k, y: f.y + f.h / 2 - leaf.y * k }, instant);
  }

  function select(leaf, centre, instant) {
    const wasOpen = !panel.hidden;
    selected = leaf || null;
    hovered = null;
    if (selected) fillPanel(selected);
    panel.hidden = !selected;
    document.body.classList.toggle("panel-open", !!selected);
    paint();
    setHash(selected ? selected.id : "");
    // If the reader has not moved the view, the whole map makes room for the panel (or takes
    // the room back). Otherwise leave their view alone and only bring the topic out from under it.
    if (!touched) { if (wasOpen !== !panel.hidden) fitAll(instant); }
    else if (selected) reveal(selected, !!centre, instant);
  }

  // ---------------------------------------------------------------- pointer, wheel, keys

  const pointers = new Map();
  let press = null, pinch = null;

  function pinchNow() {
    const p = Array.from(pointers.values());
    return { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2 };
  }
  function clicked(target) {
    const el = target && target.closest ? target : null;
    const topic = el && el.closest(".topic");
    if (topic) { select(leafOf.get(topic)); return; }
    const label = el && el.closest(".folder-label");
    if (label) { fitFolder(groupOf.get(label)); return; }
    select(null);
  }

  svg.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stop();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (_) { /* fine without capture */ }
    if (pointers.size === 1) {
      press = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target };
    } else if (pointers.size === 2) {
      press = null;
      pinch = pinchNow();
    }
  });
  svg.addEventListener("pointermove", (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (pinch && pointers.size === 2) {
      const now = pinchNow(), s = size();
      view.x += now.cx - pinch.cx;
      view.y += now.cy - pinch.cy;
      zoomAt(now.cx - s.left, now.cy - s.top, now.d / pinch.d);
      pinch = now;
      touched = true;
    } else if (press) {
      const dx = e.clientX - press.x, dy = e.clientY - press.y;
      if (!press.moved && Math.hypot(dx, dy) < 5) return;
      press.moved = true;
      touched = true;
      svg.classList.add("dragging");
      view.x = press.vx + dx;
      view.y = press.vy + dy;
      applyView();
    }
  });
  function release(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    svg.classList.remove("dragging");
    if (pinch) { pinch = null; press = null; return; }
    if (!press) return;
    const wasClick = !press.moved && e.type === "pointerup", target = press.target;
    press = null;
    if (wasClick) clicked(target);
  }
  svg.addEventListener("pointerup", release);
  svg.addEventListener("pointercancel", release);

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    stop();
    const s = size();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    touched = true;
    zoomAt(e.clientX - s.left, e.clientY - s.top, Math.exp(-dy * (e.ctrlKey ? 0.012 : 0.0022)));
  }, { passive: false });

  topics.forEach((t) => {
    t.el.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse" && !press) { hovered = t; paint(); } });
    t.el.addEventListener("pointerleave", () => { if (hovered === t) { hovered = null; paint(); } });
    t.el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(t); }
    });
  });
  groups.forEach((g) => {
    if (g === root) return;
    g.label.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fitFolder(g); }
    });
  });

  document.addEventListener("keydown", (e) => {
    if (e.target === input || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); input.focus(); }
    else if (e.key === "Escape") select(null);
    else if (e.key === "+" || e.key === "=") zoomBy(1.3);
    else if (e.key === "-" || e.key === "_") zoomBy(1 / 1.3);
    else if (e.key === "0") fitAll();
  });

  document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.3));
  document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.3));
  document.getElementById("zoom-fit").addEventListener("click", () => fitAll());
  document.getElementById("theme").addEventListener("click", () => {
    const el = document.documentElement;
    const dark = el.dataset.theme ? el.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    el.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("momentos-theme", el.dataset.theme); } catch (_) { /* not saved, still switched */ }
  });
  panel.querySelector(".close").addEventListener("click", () => select(null));
  panelBody.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-go]");
    if (b && byId.has(b.dataset.go)) select(byId.get(b.dataset.go));
  });

  // ---------------------------------------------------------------- search

  let found = [], active = 0;

  function search() {
    const s = input.value.trim().toLowerCase();
    found = topics.filter((t) => !s || (t.topic.title + " " + t.topic.folder + " " + (t.topic.essence || "")).toLowerCase().indexOf(s) >= 0);
    if (s) found.sort((a, b) => (a.topic.title.toLowerCase().indexOf(s) < 0) - (b.topic.title.toLowerCase().indexOf(s) < 0));
    active = clamp(active, 0, Math.max(0, Math.min(found.length, 80) - 1));
    results.innerHTML = found.length
      ? found.slice(0, 80).map((t, i) => '<li role="option" data-id="' + esc(t.id) + '" class="' + (t.built ? "" : "planned") + (i === active ? " active" : "") + '"><span class="t">' + rich(t.topic.title) + '</span><span class="f">' + esc(t.topic.folder) + "</span></li>").join("")
      : '<li class="none">nothing by that name yet</li>';
    results.hidden = false;
    input.setAttribute("aria-expanded", "true");
    svg.classList.toggle("searching", !!s);
    topics.forEach((t) => t.el.classList.toggle("match", !!s && found.indexOf(t) >= 0));
    const li = results.querySelector("li.active");
    if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
  }
  function closeSearch() {
    results.hidden = true;
    input.setAttribute("aria-expanded", "false");
    svg.classList.remove("searching");
  }
  function pick(leaf) {
    input.value = "";
    closeSearch();
    input.blur();
    select(leaf, true);
  }
  input.addEventListener("focus", () => { active = 0; search(); });
  input.addEventListener("input", () => { active = 0; search(); });
  input.addEventListener("blur", () => setTimeout(closeSearch, 140));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); active++; search(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active--; search(); }
    else if (e.key === "Enter") { e.preventDefault(); if (found[active]) pick(found[active]); }
    else if (e.key === "Escape") { input.value = ""; closeSearch(); input.blur(); }
  });
  results.addEventListener("pointerdown", (e) => {
    const li = e.target.closest("li[data-id]");
    if (!li) return;
    e.preventDefault();
    pick(byId.get(li.dataset.id));
  });

  // ---------------------------------------------------------------- go

  function windowShape() {
    const f = free(), a = f.w / f.h;
    return a > 1.25 ? "wide" : a < 0.8 ? "tall" : "square";
  }
  let shape = windowShape();
  layout(shape);
  draw();
  fitAll(true);

  // ---------------------------------------------------------------- filters, and the learner's levels

  const built = topics.filter((t) => t.built).length;
  const counts = document.getElementById("counts");
  const fCourse = document.getElementById("f-course"), fState = document.getElementById("f-state"), fLevel = document.getElementById("f-level");
  const courseNames = [];
  topics.forEach((t) => (t.topic.courses || []).forEach((c) => { if (courseNames.indexOf(c) < 0) courseNames.push(c); }));
  courseNames.sort().forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c; fCourse.appendChild(o); });
  svg.classList.toggle("crowded", links.length > 150);
  if (learner) {
    fLevel.hidden = false;
    const legend = document.getElementById("legend");
    legend.innerHTML = "levels of " + esc(learner.handle || "the learner") + ", " + esc(learner.generated || "") + ":" +
      [0, 1, 2, 3, 4].map((n) => '<span class="lg lg' + n + '"></span>L' + n).join("");
    legend.hidden = false;
  }
  function applyFilters() {
    const course = fCourse.value, state = fState.value, level = learner ? fLevel.value : "off";
    let shown = 0;
    topics.forEach((t) => {
      const tp = t.topic, mine = learner && learner.levels[t.id];
      const ready = !t.built && tp.plan_status === "planned";
      let ok = !course || (tp.courses || []).indexOf(course) >= 0;
      if (state === "tool" && !t.built) ok = false;
      if (state === "plan" && !ready) ok = false;
      if (state === "none" && (t.built || ready)) ok = false;
      if (level === "below" && !(mine && mine.target && (mine.level | 0) < mine.target)) ok = false;
      if (level === "due" && !(mine && mine.due)) ok = false;
      t.dim = !ok;
      t.el.classList.toggle("out", !ok);
      if (ok) shown++;
    });
    links.forEach((l) => l.el.classList.toggle("out", l.a.dim || l.b.dim));
    svg.classList.toggle("levels", !!learner && level !== "off");
    counts.textContent = (shown < topics.length ? shown + " of " : "") + topics.length + " topics · " + built + " with a tool · " + links.length + " links";
    try { localStorage.setItem("momentos-filter", JSON.stringify([course, state, level])); } catch (_) { /* applied, just not remembered */ }
  }
  try {
    const kept = JSON.parse(localStorage.getItem("momentos-filter") || "null");
    if (Array.isArray(kept)) [fCourse, fState, fLevel].forEach((el, i) => { if (typeof kept[i] === "string" && Array.prototype.some.call(el.options, (o) => o.value === kept[i])) el.value = kept[i]; });
  } catch (_) { /* no storage: start with everything shown */ }
  [fCourse, fState, fLevel].forEach((el) => el.addEventListener("change", applyFilters));
  applyFilters();
  if (problems.length) {
    problems.forEach((p) => console.warn("[momentos map] " + p));
    const w = document.createElement("span");
    w.className = "warn";
    w.textContent = problems.length + " problem" + (problems.length > 1 ? "s" : "") + " in the map data (see the console)";
    counts.parentNode.appendChild(w);
  }

  // index.html#topic-id opens the map on that topic (the tools link back this way)
  function fromHash(instant) {
    let id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { /* odd hash: ignore */ }
    if (id && byId.has(id) && selected !== byId.get(id)) select(byId.get(id), true, instant === true);
  }
  window.addEventListener("hashchange", fromHash);
  let resizing = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizing);
    resizing = setTimeout(() => {
      const now = windowShape();
      if (now !== shape) { shape = now; layout(shape); draw(); fitAll(true); }
      else if (!touched) fitAll(true);
    }, 120);
  });
  fromHash(true);     // arriving on a topic: no need to animate from a view nobody saw

  // handy when poking at the layout from the console
  window.MOMENTOS = { topics: topics, links: links, groups: groups, root: root, view: view, problems: problems, quality: quality, layoutChosen: () => chosen, drawn: () => ({ bent: bent, overruns: overruns }), learner: learner, applyFilters: applyFilters, fitAll: fitAll, select: select, byId: byId,
    // jump straight to a folder, with no animation (used when checking the page with screenshots)
    show: (path) => { const g = groups.get(path); if (g) { touched = true; go(frame(g.x, g.y, g.R + 14, 2.6), true); } } };
})();
</script>
</body>
