{"id": "mosfet-structure", "title": "MOSFET structure", "folder": "devices/mos", "essence": "A MOSFET is a MOS capacitor with an n+ source and drain on either side of the gate. Below threshold they are two back-to-back diodes and nothing flows. Above it the electron layer joins them: a channel whose charge the gate controls.", "check": "Why must the body of an NMOS sit at the lowest voltage in the circuit?", "courses": ["EE 105"]},
{"id": "mosfet-regions", "title": "MOSFET regions", "folder": "devices/mos", "essence": "Cut-off when V_GS < V_T. Triode when the channel reaches all the way to the drain, V_DS < V_GS − V_T. Saturation when it does not, V_DS ≥ V_GS − V_T. Find the region before using any equation.", "check": "An NMOS with V_T = 0.5 V has its gate at 1.2 V, source at 0 V and drain at 0.5 V. Which region is it in, and how far must the drain rise to change that?", "tools": ["devices/mos/mosfet-channel.html"], "courses": ["EE 105"]},
{"id": "triode-region", "title": "triode region", "folder": "devices/mos", "essence": "With a small V_DS the channel is a uniform sheet of charge C_ox(V_GS − V_T) per area, and the transistor is a resistor set by the gate. As V_DS grows the channel thins toward the drain and the current bends over: I_D = μC_ox(W/L)(V_GS − V_T − V_DS/2)V_DS.", "check": "With V_DS = 10 mV you double V_GS − V_T. What happens to the channel's resistance, and why?", "tools": ["devices/mos/mosfet-channel.html"], "courses": ["EE 105"]},
{"id": "pinch-off", "title": "pinch-off", "folder": "devices/mos", "essence": "When V_DS reaches V_GS − V_T, the gate-to-channel voltage at the drain end falls to threshold and the channel charge there vanishes. Any extra drain voltage drops across a short high-field gap that carriers shoot through, so the current stops growing.", "check": "If the channel charge is zero at the drain end, how can current still flow there?", "tools": ["devices/mos/mosfet-channel.html"], "courses": ["EE 105"]},
{"id": "square-law", "title": "square law", "folder": "devices/mos", "essence": "In saturation the gate alone sets the current: I_D = ½μC_ox(W/L)(V_GS − V_T)². Call V_OV = V_GS − V_T the overdrive. Double it and the current quadruples.", "check": "A transistor in saturation carries 100 μA with V_OV = 0.2 V. What current flows at V_OV = 0.3 V? What if instead you keep V_OV = 0.2 V and double W?", "tools": ["devices/mos/mosfet-channel.html"], "courses": ["EE 105"]},
{"id": "channel-length-modulation", "title": "channel-length modulation", "folder": "devices/mos", "essence": "Above saturation the pinch-off point creeps toward the source, so the channel gets shorter and the current rises slowly with V_DS: I_D(1 + λV_DS). Seen by a small signal this is the output resistance r_o = 1/(λI_D).", "check": "Two transistors carry the same current, and one is twice as long as the other. Which has the larger r_o, and why?", "tools": ["circuits/amplifiers/current-mirror.html"], "courses": ["EE 105"]},
{"id": "pmos", "title": "PMOS", "folder": "devices/mos", "essence": "A PMOS is an NMOS with every polarity flipped: holes in an n-type body, with the source on the high side. Write it with V_SG, V_SD, I_SD and |V_T| and every NMOS equation and curve carries over unchanged.", "check": "A PMOS with |V_T| = 0.5 V has its source at 3 V, gate at 1.5 V and drain at 1.5 V. Which region is it in?", "courses": ["EE 105"]},
{"id": "body-effect", "title": "body effect", "folder": "devices/mos", "essence": "The body is a second, weaker gate. Raise the source above the body and the depletion layer must hold more charge, so V_T rises. For small signals this is a second current source g_mb·v_bs, typically 10 to 30% of g_m·v_gs for the same voltage.", "check": "In a source follower with its body grounded, the source moves up and down with the output. Why does that pull the gain further below 1?", "courses": ["EE 105"]},
{"id": "mos-small-signal-model", "title": "MOS small-signal model", "folder": "devices/mos", "essence": "Around its bias point a saturated MOSFET is a current source g_m·v_gs from drain to source, with r_o across it and no current into the gate. That one picture replaces the square law in every small-signal problem.", "check": "In the small-signal model, why is there no resistor between gate and source?", "tools": ["circuits/amplifiers/small-signal-analysis.html"], "courses": ["EE 105"]},
{"id": "mos-capacitances", "title": "MOSFET capacitances", "folder": "devices/mos", "essence": "In saturation the channel hangs from the source end, so most gate capacitance is C_gs ≈ ⅔WLC_ox plus overlap, while C_gd is only overlap and fringe. The source and drain junctions add C_sb and C_db to the body. These set every high-frequency limit.", "check": "Why is C_gd much smaller than C_gs in saturation, yet often the more harmful of the two in a common-source stage?", "courses": ["EE 105"]},
{"id": "transit-frequency", "title": "transit frequency", "folder": "devices/mos", "essence": "Drive the gate with a current and short the drain: the current gain g_m/(jω(C_gs + C_gd)) falls to 1 at f_T ≈ g_m/(2π(C_gs + C_gd)). It is the transistor's own speed limit, set by how long a carrier takes to cross the channel.", "check": "You double a transistor's width at the same overdrive. What happens to g_m, to C_gs and to f_T?", "courses": ["EE 105"]},
{"id": "pn-equilibrium", "title": "pn junction in equilibrium", "folder": "devices/pn-junction", "essence": "Join p and n silicon and holes diffuse into the n side, electrons into the p side. They leave bare ions behind, whose field pushes carriers back. Equilibrium comes when that drift exactly cancels the diffusion, for each carrier separately.", "check": "In a junction at equilibrium a large diffusion current of holes flows from the p side to the n side. Why is the net hole current still zero?", "courses": ["EE 105"]},
{"id": "depletion-region", "title": "depletion region", "folder": "devices/pn-junction", "essence": "Near the junction the free carriers are swept out, leaving bare ions: negative on the p side, positive on the n side. The depletion approximation treats them as two boxes of fixed charge with sharp edges, enough to draw the field and potential.", "check": "Sketch the charge density, the field and the potential across a junction doped equally on both sides. Where is the field strongest, and why there?", "courses": ["EE 105"]},
{"id": "built-in-potential", "title": "built-in potential", "folder": "devices/pn-junction", "essence": "The potential step across a junction in equilibrium is the difference of the two sides' potentials: φ_bi = (kT/q)·ln(N_A·N_D/n_i²), about 0.6 to 1 V. A voltmeter cannot read it, because the metal contacts add steps that cancel it.", "check": "You raise the doping on the n side tenfold. By how much does the built-in potential rise, and why can you not power anything from it?", "courses": ["EE 105"]},
{"id": "depletion-width", "title": "depletion width", "folder": "devices/pn-junction", "essence": "The charge on the two sides must balance, N_A·x_p = N_D·x_n, so the depletion region reaches deep into the lightly doped side and barely into the heavy one. Its width grows as the square root of the voltage across it.", "check": "One side of a junction is doped 100 times more heavily than the other. Where does most of the depletion region lie, and what happens to its width when reverse bias quadruples the total potential across it?", "courses": ["EE 105"]},
{"id": "pn-reverse-bias", "title": "reverse bias", "folder": "devices/pn-junction", "essence": "Reverse bias adds to the built-in step, so diffusion over the barrier stops. Only minority carriers that wander to the edge are swept across, a tiny current that does not grow with voltage. The depletion region widens to hold the extra voltage.", "check": "Doubling the reverse voltage across a diode barely changes its current. Why?", "courses": ["EE 105"]},
{"id": "depletion-capacitance", "title": "depletion capacitance", "folder": "devices/pn-junction", "essence": "A wider depletion region holds more fixed charge, so the junction stores charge like a capacitor whose plate spacing is the depletion width: C_j = εA/W. More reverse bias spreads the plates and lowers C_j, which is how a varactor tunes a circuit.", "check": "You plot 1/C_j² against reverse voltage for a one-sided junction. What shape do you expect, and what does the point where the line meets the voltage axis tell you?", "courses": ["EE 105"]},
{"id": "pn-forward-bias", "title": "forward bias", "folder": "devices/pn-junction", "essence": "Forward bias lowers the barrier by V_D, so e^(qV_D/kT) times as many majority carriers cross and arrive as minority carriers on the far side. The minority density at each depletion edge rises by that factor; the rest of the story is diffusion.", "check": "The forward voltage on a diode rises by 60 mV. By roughly what factor does the minority-carrier density at the depletion edges rise?", "courses": ["EE 105"]},
{"id": "minority-carrier-diffusion", "title": "minority-carrier profiles", "folder": "devices/pn-junction", "essence": "Injected minority carriers diffuse away from the junction and recombine as they go. In a long region they die out as e^(−x/L), with L = √(Dτ); in a region much shorter than L they fall in a straight line. The slope at the edge sets the current.", "check": "A diode's n region is shortened from many diffusion lengths to a tenth of one. Does the current at a given voltage go up or down, and why?", "courses": ["EE 105"]},
{"id": "diode-iv", "title": "diode I–V", "folder": "devices/pn-junction", "essence": "A diode carries I = I_S(e^(qV_D/kT) − 1): ten times more current for every 60 mV forward, and a tiny −I_S in reverse. I_S is set by the doping, the area and how far the minority carriers diffuse.", "check": "A diode carries 1 mA at 0.65 V. Roughly what voltage gives 10 mA, and what voltage gives 1 μA?", "courses": ["EE 105"]},
{"id": "diode-small-signal", "title": "diode small-signal model", "folder": "devices/pn-junction", "essence": "Bias a diode at a current I_D and a small wiggle in voltage sees the tangent of the exponential: a resistance r_d = (kT/q)/I_D, which is 26 Ω at 1 mA. More bias current means a smaller resistance.", "check": "A diode is biased first at 0.1 mA and then at 10 mA. What is its small-signal resistance in each case, and how small must the signal be for the tangent to hold?", "courses": ["EE 105"]},
{"id": "diffusion-capacitance", "title": "diffusion capacitance", "folder": "devices/pn-junction", "essence": "A forward-biased diode stores minority charge in its neutral regions, about I_D·τ. Change the voltage and that charge must change too, which looks like a capacitance C_d ≈ I_D·τ/(kT/q) that grows with the bias current.", "check": "Why does a forward-biased diode have a much larger capacitance than the same diode under reverse bias?", "courses": ["EE 105"]},
{"id": "photodiode-solar-cell", "title": "photodiodes and solar cells", "folder": "devices/pn-junction", "essence": "Light makes electron-hole pairs, and those born within a diffusion length of the junction are swept across: current flowing backwards through the diode. With a load attached the diode's forward current pushes back, and the cell delivers power.", "check": "The short-circuit current of a lit solar cell doubles. Does its open-circuit voltage double too? Say why or why not.", "courses": ["EE 105"]},
{"id": "energy-bands", "title": "energy bands", "folder": "devices/semiconductors", "essence": "In a crystal an electron's energy can only lie in allowed bands. In a semiconductor the valence band is full and the conduction band empty, with a gap E_g between (1.12 eV in silicon). Only electrons lifted across the gap, and their holes, carry current.", "check": "Why does a perfectly pure silicon crystal at 0 K carry no current at all, even with a field across it?", "courses": ["EE 105"]},
{"id": "electrons-and-holes", "title": "electrons and holes", "folder": "devices/semiconductors", "essence": "Break one bond and you get two carriers: a free electron, and a vacancy that neighbouring electrons hop into, so the vacancy moves like a positive particle. The hole is the bookkeeping for a band that is almost full.", "check": "A field points to the right inside a piece of silicon. Which way do the electrons drift, which way do the holes drift, and which way does each one's current point?", "courses": ["EE 105"]},
{"id": "intrinsic-carriers", "title": "intrinsic carriers", "folder": "devices/semiconductors", "essence": "In pure silicon every free electron leaves a hole, so n = p = n_i, about 10¹⁰ cm⁻³ at 300 K. Heat lifts more electrons across the gap, so n_i grows exponentially with temperature: roughly doubling every 9 K near room temperature.", "check": "Why does a semiconductor conduct better when it is heated, while a metal conducts worse?", "courses": ["EE 105"]},
{"id": "mass-action-law", "title": "mass-action law", "folder": "devices/semiconductors", "essence": "Generation and recombination balance in equilibrium, so the product np stays at n_i² whatever the doping. Push n up a millionfold with donors and p falls a millionfold.", "check": "Silicon is doped with 10¹⁶ cm⁻³ donors. How many holes per cm³ are there at 300 K, and why are there fewer than in pure silicon?", "courses": ["EE 105"]},
{"id": "doping", "title": "doping", "folder": "devices/semiconductors", "essence": "Phosphorus has one electron more than its four bonds need and gives it away; boron has one fewer and takes one, leaving a hole. A few dopant atoms per million set which carrier dominates. With both kinds present, the larger wins by the difference.", "check": "Silicon holds 10¹⁷ cm⁻³ boron and 4×10¹⁶ cm⁻³ phosphorus. Is it n-type or p-type, and roughly how many majority carriers per cm³ does it have?", "courses": ["EE 105"]},
{"id": "potential-vs-doping", "title": "potential and doping", "folder": "devices/semiconductors", "essence": "A doped region's potential, measured from intrinsic silicon, is (kT/q)·ln(n/n_i): about 60 mV per decade of doping, positive for n-type and negative for p-type. Every built-in potential is a difference of two of these.", "check": "An n-type region has 10¹⁶ cm⁻³ electrons and n_i = 10¹⁰ cm⁻³. Without a calculator, what is its potential relative to intrinsic silicon?", "courses": ["EE 105"]},
{"id": "mobility", "title": "mobility", "folder": "devices/semiconductors", "essence": "A carrier is pushed by the field, then knocked off course by a collision about every tenth of a picosecond. Mobility μ is its average drift speed per unit field. Dopant ions and a hotter lattice scatter more and lower μ. Electrons outrun holes 2 to 3 times.", "check": "You raise the doping of a silicon bar tenfold. Why does its resistivity fall by less than ten times?", "tools": ["devices/semiconductors/drift-and-mobility.html"], "courses": ["EE 105"]},
{"id": "drift-current", "title": "drift current", "folder": "devices/semiconductors", "essence": "A field adds a small average velocity v = μE on top of fast random motion. Current density is charge times density times that velocity, J = q(nμ_n + pμ_p)E. Electrons and holes drift opposite ways, but both currents point along E.", "check": "Two bars of the same size carry the same current. One has twice the electron density. How does its electron drift velocity compare with the other's?", "tools": ["devices/semiconductors/drift-and-mobility.html"], "courses": ["EE 105"]},
{"id": "resistivity", "title": "resistivity", "folder": "devices/semiconductors", "essence": "A doped bar's resistivity is set almost entirely by its majority carriers: ρ ≈ 1/(qNμ) for a doping N. The minority carriers are outnumbered by many decades and add nothing you could measure.", "check": "A bar is doped with 10¹⁶ cm⁻³ donors. Why can you ignore its holes when you work out its resistance, even though they drift too?", "tools": ["devices/semiconductors/drift-and-mobility.html"], "courses": ["EE 105"]},
{"id": "diffusion-current", "title": "diffusion current", "folder": "devices/semiconductors", "essence": "Random motion alone carries particles from where they are crowded to where they are sparse, with no field at all. The flow follows the slope of the concentration: J_n = qD_n·dn/dx for electrons and J_p = −qD_p·dp/dx for holes.", "check": "Holes are piled up at the left end of a bar and spread to the right. Which way does the hole current point? Which way would the current point if electrons were piled up there instead?", "courses": ["EE 105"]},
{"id": "einstein-relation", "title": "Einstein relation", "folder": "devices/semiconductors", "essence": "Drift and diffusion are both limited by the same collisions, so the diffusion constant and the mobility are tied: D/μ = kT/q. Know how mobile a carrier is and you know how fast it spreads.", "check": "Electrons in a sample have a mobility of 1000 cm²/V·s. What is their diffusion constant at 300 K, and why should cooling the sample change the ratio D/μ?", "courses": ["EE 105"]},
{"id": "velocity-saturation", "title": "velocity saturation", "folder": "devices/semiconductors", "essence": "At high fields carriers lose energy to the lattice as fast as the field gives it, so their drift speed stops near 10⁷ cm/s in silicon. A very short transistor then carries a current that grows linearly with V_GS − V_T instead of as its square.", "check": "A transistor's channel is made ten times shorter, at the same voltages. Why does its current grow by much less than ten times?", "tools": ["devices/semiconductors/drift-and-mobility.html"], "courses": ["EE 105"]},
{"id": "recombination-and-lifetime", "title": "recombination and lifetime", "folder": "devices/semiconductors", "essence": "An extra electron in p-type silicon survives, on average, a lifetime τ before it meets a hole and recombines, usually at a defect near the middle of the gap. Disturb the balance and the excess dies away as e^(−t/τ).", "check": "Light makes extra electrons and holes in a p-type bar and is then switched off. What sets how fast the extra electrons disappear, and why does the hole density barely change in relative terms?", "courses": ["EE 105"]},
{"id": "planar-process", "title": "planar IC process", "folder": "devices", "essence": "A chip is made from the top down: grow oxide, coat it with photoresist, expose a pattern through a mask, etch windows and implant dopants through them. The designer draws lengths and widths; the process fixes depths, thicknesses and doping.", "check": "Why can an IC designer choose a resistor's length and width but not its thickness?", "courses": ["EE 105"]},
{"id": "sheet-resistance", "title": "sheet resistance", "folder": "devices", "essence": "A thin layer of fixed thickness has the same resistance across any square of it, whatever the square's size: R_□, in ohms per square. A resistor is R_□ times its number of squares, L/W.", "check": "A 10 μm by 10 μm square of a layer measures 200 Ω edge to edge. What does a 1 μm square measure, and a strip 50 μm long and 5 μm wide?", "courses": ["EE 105"]},
{"id": "ic-capacitor", "title": "IC capacitor", "folder": "devices", "essence": "Two conducting layers with thin oxide between them form a parallel-plate capacitor, C = ε_ox·A/t_ox. The process fixes the oxide thickness, so the capacitance per area is fixed and the designer chooses only the area.", "check": "You halve the oxide thickness and halve the plate area. What happens to the capacitance, and to the voltage it can safely hold?", "courses": ["EE 105"]},
{"id": "incremental-capacitance", "title": "small-signal capacitance", "folder": "devices", "essence": "When stored charge is not proportional to voltage, capacitance is the slope dQ/dV at the bias point. A small wiggle in voltage moves the charge by C times the wiggle, and C changes when the bias changes.", "check": "A junction's charge grows as the square root of its reverse voltage. Does its small-signal capacitance rise or fall as the reverse bias grows, and why?", "courses": ["EE 105"]},
{"id": "transconductance", "title": "transconductance", "folder": "devices", "essence": "Transconductance g_m is how much output current changes per volt at the input: the slope at the bias point. A MOSFET gives g_m = 2I_D/V_OV and a BJT g_m = I_C/(kT/q), so at the same current the BJT gives more.", "check": "A MOSFET with V_OV = 0.2 V and a BJT each carry 1 mA. Which has the larger g_m, and by about how much?", "tools": ["circuits/amplifiers/small-signal-analysis.html"], "courses": ["EE 105"]},
{"id": "complex-plane", "title": "complex plane", "folder": "maths/complex-numbers", "essence": "A complex number is a point in a plane. Multiplying by j turns it a quarter turn; multiplying by any number on the unit circle turns it without stretching it.", "check": "Where does a point end up after you multiply it by j twice? Why is that the same as multiplying by −1?", "tools": ["signals/complex-periodicity.html"], "courses": ["EE 120"]},
{"id": "eulers-formula", "title": "Euler's formula", "folder": "maths/complex-numbers", "essence": "e^(jθ) = cos θ + j sin θ: the point at angle θ on the unit circle. Multiplying two of them adds their angles.", "check": "What is e^(jπ/2) times e^(jπ/2), and where is it on the circle?", "tools": ["signals/complex-periodicity.html"], "courses": ["EE 120"]},
{"id": "dot-product", "title": "dot product", "folder": "maths/linear-algebra", "essence": "How much of one vector lies along another: |a||b|cos θ. Zero when they are perpendicular.", "check": "a·b is negative. Without computing anything, what does the picture look like?", "tools": ["maths/linear-algebra/vector-products.html"]},
{"id": "projection", "title": "projection", "folder": "maths/linear-algebra", "essence": "The shadow one vector casts on another. Any b splits into a part along a and a part across it.", "check": "You double the length of a. What happens to the shadow of b on a, and what happens to a·b?", "tools": ["maths/linear-algebra/vector-products.html"]},
{"id": "cross-product", "title": "cross product", "folder": "maths/linear-algebra", "essence": "How much of one vector lies across another: |a||b|sin θ, the signed area the two span. Zero when they are parallel.", "check": "Swap a and b. What changes in the picture, and why does the sign flip?", "tools": ["maths/linear-algebra/vector-products.html"]},
{"id": "determinant", "title": "determinant", "folder": "maths/linear-algebra", "essence": "The factor by which a matrix scales area. Zero means it flattens the plane onto a line.", "check": "A matrix has determinant −2. What does it do to the area of a shape, and what does the minus sign do to it?"},
{"id": "linear-systems", "title": "linear systems", "folder": "maths/linear-algebra", "essence": "Ax = b asks which mix of the columns of A lands on b.", "check": "The two columns of A point along the same line and b is off that line. How many solutions does Ax = b have, and why?"},
{"id": "eigenvectors", "title": "eigenvectors", "folder": "maths/linear-algebra", "essence": "The directions a matrix only stretches and never turns.", "check": "A matrix turns every vector by 90°. Can it have a real eigenvector? What would that vector have to do?"},
{"id": "gauss-law", "title": "Gauss's law", "folder": "physics/electromagnetism", "essence": "Field lines start and end on charge. The flux leaving a closed surface is the charge inside over ε, so a sheet of charge makes the field jump, and where the material changes with no charge there, εE stays the same across the boundary.", "check": "There is no charge at the oxide–silicon interface of a MOS capacitor, and the field in the oxide is 3 MV/cm. Is the field just inside the silicon larger or smaller, and by about what factor?", "courses": ["EE 105"]},
{"id": "poisson-equation", "title": "Poisson's equation", "folder": "physics/electromagnetism", "essence": "In one dimension the slope of the field is the charge density over ε, and the field is minus the slope of the potential. Integrate the charge once for the field and again for the potential: a box of charge gives a triangle of field and a parabola of potential.", "check": "A layer holds uniform positive charge on one side of a plane and uniform negative charge on the other. Sketch the field. Where is it largest, and why is the potential made of two parabolas?", "courses": ["EE 105"]},
{"id": "boltzmann-factor", "title": "Boltzmann factor", "folder": "physics/thermodynamics", "essence": "In thermal equilibrium the share of particles with at least an energy E more than the rest falls as e^(−E/kT). Lower a barrier by qV and e^(qV/kT) times as many carriers clear it. At 300 K, kT/q ≈ 26 mV.", "check": "A barrier for electrons is lowered by 60 mV at room temperature. Roughly how many times more electrons get over it, and why does it not matter how high the barrier was to begin with?", "courses": ["EE 105"]},
{"id": "work", "title": "work", "folder": "physics", "essence": "Force times the distance moved along it: W = F·d.", "check": "You carry a box across a level floor at constant speed. How much work does gravity do on it, and why?"},
{"id": "magnetic-force", "title": "magnetic force", "folder": "physics", "essence": "A moving charge in a magnetic field is pushed sideways: F = qv × B.", "check": "A charge moves parallel to a magnetic field. What force does it feel? What if it moves across the field instead?"},
{"id": "fourier-series", "title": "Fourier series", "folder": "signals/fourier", "essence": "Any periodic signal is a sum of phasors spinning at whole multiples of one fundamental frequency.", "check": "You make a square wave's period twice as long. What happens to the spacing of its harmonics on the frequency axis?", "courses": ["EE 120"]},
{"id": "dtfs", "title": "discrete-time Fourier series", "folder": "signals/fourier", "essence": "A sequence that repeats every N samples is a sum of exactly N phasors e^(j2πkn/N), for k = 0 to N − 1. N numbers in time become N numbers in frequency, and nothing is lost.", "check": "A sequence has period 4. How many distinct harmonics does it have, and why are there no more?", "courses": ["EE 120"]},
{"id": "dft", "title": "DFT", "folder": "signals/fourier", "essence": "The DFT is that same change of basis applied to any N samples, written as an N by N matrix whose columns are orthogonal phasors. Its inverse is its conjugate transpose, up to a constant.", "check": "Why is the inverse of the DFT matrix so easy to write down?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "The DFT and the FFT are the working tools for measuring spectra and for fast filtering."}]},
{"id": "fft", "title": "FFT", "folder": "signals/fourier", "essence": "The FFT computes the DFT by splitting the samples into even and odd halves, again and again. The work drops from N² operations to N log₂ N.", "check": "For N = 1024, roughly how many times less work is the FFT than the direct sum?", "courses": ["EE 120"]},
{"id": "fourier-symmetry", "title": "symmetry and shifts in Fourier series", "folder": "signals/fourier", "essence": "The look of a signal in time fixes the pattern of its coefficients. A real signal has conjugate-symmetric coefficients, a real even signal has real ones, and a time shift only turns each coefficient's phase.", "check": "A real periodic signal is shifted by half a period. What happens to the magnitude and to the phase of its kth coefficient?", "courses": ["EE 120"]},
{"id": "parseval", "title": "Parseval's relation", "folder": "signals/fourier", "essence": "The energy of a signal added up over time equals its energy added up over frequency. Changing to an orthogonal basis does not change a vector's length.", "check": "A periodic signal has only two non-zero Fourier coefficients, of magnitudes 3 and 4. What is its average power?", "courses": ["EE 120"]},
{"id": "fourier-transform", "title": "Fourier transform", "folder": "signals/fourier", "essence": "Let the period grow without limit and the harmonics crowd together into a continuum. X(jω) says how much of the phasor e^(jωt) the signal contains, per unit of frequency.", "check": "A pulse is made narrower. Before any calculation, what must happen to its transform?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Filter design is done on the frequency axis, then carried back to time."}]},
{"id": "dtft", "title": "DTFT", "folder": "signals/fourier", "essence": "The DTFT is the spectrum of a sequence. It always repeats every 2π in ω, because a sequence cannot tell ω from ω + 2π.", "check": "x[n] is 1 at n = 0 and at n = 1, and zero elsewhere. Between −π and π, where is |X| largest and where is it zero?", "courses": ["EE 120"]},
{"id": "ft-time-shift", "title": "time shift is a phase ramp", "folder": "signals/fourier", "essence": "Delay a signal and the magnitude of its transform does not change. Each frequency's phase turns by −ωt₀, a straight line in ω.", "check": "Two signals have the same |X(jω)| and different phases. What is the simplest way they can differ in time?", "courses": ["EE 120"]},
{"id": "ft-frequency-shift", "title": "frequency shift", "folder": "signals/fourier", "essence": "Multiply a signal by e^(jω₀t) and its whole spectrum slides to ω₀. Multiplying by a cosine makes two half-size copies, at +ω₀ and −ω₀.", "check": "A signal whose spectrum is 1 kHz wide about zero is multiplied by a 10 kHz cosine. Where is its spectrum now?", "courses": ["EE 120"]},
{"id": "ft-convolution-property", "title": "convolution becomes multiplication", "folder": "signals/fourier", "essence": "Convolution in time is multiplication in frequency. That is why filtering is simple in frequency: the output spectrum is the input spectrum times H.", "check": "A signal goes through the same filter twice. What happens to its spectrum?", "courses": ["EE 120"]},
{"id": "ft-multiplication-property", "title": "multiplication becomes convolution", "folder": "signals/fourier", "essence": "Multiplication in time is convolution in frequency. Cutting a signal off with a window smears its spectrum by the window's transform.", "check": "A pure tone is observed for only 10 ms. Why is its measured spectrum not a single line, and roughly how wide is it?", "courses": ["EE 120"]},
{"id": "ft-duality", "title": "duality", "folder": "signals/fourier", "essence": "The transform and its inverse have the same form, so every pair works both ways. A rectangle in time is a sinc in frequency, and a sinc in time is a rectangle in frequency.", "check": "The transform of a rectangle is a sinc. What is the transform of a sinc, and which familiar system has that frequency response?", "courses": ["EE 120"]},
{"id": "time-bandwidth", "title": "time and bandwidth trade off", "folder": "signals/fourier", "essence": "Squeeze a signal in time and its spectrum spreads by the same factor. A signal cannot be short in time and narrow in frequency at once.", "check": "A pulse is made 10 times shorter. What happens to the bandwidth it needs?", "courses": ["EE 120"], "later": [{"course": "EE 121", "how": "The rate at which symbols can be sent is limited by the bandwidth of the channel."}]},
{"id": "ft-differentiation", "title": "differentiation in frequency", "folder": "signals/fourier", "essence": "Differentiating in time multiplies the transform by jω. High frequencies are boosted and a constant is removed.", "check": "Why does differentiating a noisy measurement make the noise look worse?", "courses": ["EE 120"]},
{"id": "spectrum-of-periodic-signals", "title": "spectrum of a periodic signal", "folder": "signals/fourier", "essence": "A periodic signal's transform is a row of impulses at the harmonics, weighted by the Fourier series coefficients. Repeating in time is sampling in frequency.", "check": "One pulse has a smooth spectrum. The pulse is now repeated every T seconds. What does the spectrum become?", "courses": ["EE 120"]},
{"id": "impulse-train", "title": "impulse train", "folder": "signals/fourier", "essence": "A row of impulses T apart in time transforms into a row of impulses 2π/T apart in frequency. Pack them closer in time and they move apart in frequency.", "check": "The impulses are moved twice as close together in time. What happens to the spacing of the lines in frequency?", "courses": ["EE 120"]},
{"id": "rect-and-sinc", "title": "rectangle and sinc", "folder": "signals/fourier", "essence": "A rectangle of width T has a sinc for its transform, with its first zeros at ±2π/T. The narrower the rectangle, the wider the main lobe.", "check": "A rectangle is 2 ms wide. At what frequency, in hertz, is the first zero of its transform?", "courses": ["EE 120"]},
{"id": "windowing", "title": "windowing and leakage", "folder": "signals/fourier", "essence": "Looking at a signal through a finite window replaces each spectral line by a copy of the window's transform. Its width blurs nearby tones together, and its side lobes leak energy across the spectrum.", "check": "Two tones 5 Hz apart are recorded for 0.1 s. Can the spectrum show two peaks? What would you change?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Choosing a window sets the trade between resolution and leakage in every spectrum estimate."}]},
{"id": "fourier-transform-2d", "title": "Fourier transform in two dimensions", "folder": "signals/fourier", "essence": "An image is a sum of two-dimensional waves, each with a direction and a spacing. A point of the 2-D transform far from the centre is fine detail in that direction.", "check": "An image contains vertical stripes only. Where in the 2-D frequency plane is its transform non-zero?", "courses": ["EE 120"], "later": [{"course": "EE 118", "how": "A lens forms the two-dimensional Fourier transform of the light in its front focal plane."}]},
{"id": "sampling-theorem", "title": "sampling theorem", "folder": "signals/sampling", "essence": "Sampling every T seconds copies the spectrum at every multiple of the sampling frequency. If the copies do not overlap, the original is still there, so sample faster than twice the highest frequency.", "check": "A signal has nothing above 3 kHz. What is the slowest sampling rate that loses nothing, and what goes wrong just below it?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Data converters and multirate systems are designed by moving and filtering the spectral copies."}]},
{"id": "aliasing", "title": "aliasing", "folder": "signals/sampling", "essence": "When the copies overlap, a frequency above half the sampling rate lands on top of a lower one and cannot be told apart from it afterwards.", "check": "A 7 kHz tone is sampled at 10 kHz. What frequency does it appear as?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Anti-aliasing filters and oversampling exist to control it."}]},
{"id": "reconstruction", "title": "reconstruction", "folder": "signals/sampling", "essence": "To get the signal back, keep one copy of the spectrum with a low-pass filter. In time, that is placing a sinc on every sample and adding them up.", "check": "Between two samples, what decides the value of the rebuilt signal: its two neighbours only, or all the samples?", "courses": ["EE 120"]},
{"id": "zero-order-hold", "title": "zero-order hold", "folder": "signals/sampling", "essence": "A practical converter holds each sample until the next one, making a staircase. Holding is itself a filter: it droops the top of the band and leaves faint images above it.", "check": "What does the staircase contain that the smooth original does not, and where is it in frequency?", "courses": ["EE 120"]},
{"id": "dt-processing-of-ct", "title": "digital filtering of analog signals", "folder": "signals/sampling", "essence": "Sample, filter the numbers, then reconstruct. Below half the sampling rate the whole chain acts as one continuous-time filter: the digital filter's response with its frequency axis stretched by the sampling rate.", "check": "A digital low-pass has its cutoff at π/4 rad per sample, and the sampling rate is 8 kHz. What is the cutoff of the whole chain in hertz?", "courses": ["EE 120"]},
{"id": "downsampling", "title": "downsampling", "folder": "signals/sampling", "essence": "Keep every Mth sample and the spectrum stretches by M. Anything above π/M beforehand folds back on top of the rest, so filter first.", "check": "A sequence with content up to π/2 is downsampled by 3 with no filter. Does it alias? Why?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Decimators, interpolators and filter banks are built from these two operations."}]},
{"id": "upsampling", "title": "upsampling", "folder": "signals/sampling", "essence": "Insert M − 1 zeros between samples and the spectrum squeezes by M, which brings M − 1 unwanted images into view. A low-pass filter removes them, and in time it fills in the zeros.", "check": "One zero is inserted between each pair of samples. Where does the unwanted image sit before filtering?", "courses": ["EE 120"]},
{"id": "complex-exponential", "title": "complex exponential", "folder": "signals", "essence": "e^(jωt) is a point going round the unit circle, ω radians every second. Cosine and sine are its two shadows.", "check": "The phasor turns clockwise instead. Which of its two shadows can tell the difference?", "tools": ["signals/complex-periodicity.html"], "courses": ["EE 120"]},
{"id": "periodicity", "title": "periodicity", "folder": "signals", "essence": "A signal repeats when its phasor comes back to where it started. In continuous time it always does. In discrete time it does only if a whole number of steps makes a whole number of turns.", "check": "Is e^(jn), one radian per step, periodic? What about e^(j2πn·3/8)?", "tools": ["signals/complex-periodicity.html"], "courses": ["EE 120"]},
{"id": "signal-operations", "title": "shift, flip, scale", "folder": "signals", "essence": "Operations on the time axis move a signal without changing its shape: x(t − 2) is the same shape arriving 2 s later, x(−t) is it played backwards, x(2t) is it played twice as fast.", "check": "You want x(3 − 2t) from x(t). Where does the point that was at t = 0 end up, and is the result wider or narrower?", "courses": ["EE 120"]},
{"id": "even-odd-parts", "title": "even and odd parts", "folder": "signals", "essence": "Every signal is the sum of an even part, which is its own mirror image about t = 0, and an odd part, whose mirror image has the sign flipped.", "check": "What are the even and odd parts of a unit step? Sketch both in words.", "courses": ["EE 120"]},
{"id": "energy-and-power", "title": "energy and power", "folder": "signals", "essence": "Energy is the total of |x|² over all time. Power is its average per unit time. A pulse has finite energy. A sinusoid that never stops has infinite energy and finite power.", "check": "Is e^(−t) switched on at t = 0 an energy signal or a power signal? What about a cosine that never ends?", "courses": ["EE 120"]},
{"id": "unit-impulse", "title": "unit impulse", "folder": "signals", "essence": "An impulse puts all of its unit area at one instant. In discrete time it is a single sample of height 1. Multiplying a signal by an impulse and adding up picks out one value of the signal.", "check": "Why does only the area of an impulse matter, and never its height or its width?", "courses": ["EE 120"]},
{"id": "unit-step", "title": "unit step", "folder": "signals", "essence": "The step switches on at zero and stays on. It is the running total of the impulse, and the impulse is the step's rate of change.", "check": "Build a pulse that is 1 from t = 2 s to t = 5 s out of two steps. Then say what its derivative looks like.", "courses": ["EE 120"]},
{"id": "impulse-decomposition", "title": "signals as sums of impulses", "folder": "signals", "essence": "Any signal is a sum of shifted, scaled impulses, one for each instant: x[n] = Σ x[k] δ[n − k]. Once you see a signal this way, a linear time-invariant system has no choice about what it does.", "check": "A sequence has values 2, −1, 3 at n = 0, 1, 2. Write it as three shifted impulses. What would an LTI system with impulse response h do to each one?", "courses": ["EE 120"]},
{"id": "dt-frequency", "title": "discrete-time frequency", "folder": "signals", "essence": "In discrete time the frequencies ω and ω + 2π give exactly the same samples. So the fastest a sequence can wiggle is ω = π rad per sample: +1, −1, +1, −1.", "check": "Which sequence oscillates faster, cos(0.9πn) or cos(1.1πn)? Why?", "courses": ["EE 120"]},
{"id": "signal-inner-product", "title": "signals as vectors", "folder": "signals", "essence": "A signal is a vector with one coordinate per sample. The inner product ⟨x, y⟩ = Σ x[n] y*[n] says how much of one signal lies along another. When it is zero the two are orthogonal.", "check": "Over one period, what is the inner product of e^(j2πn/8) and e^(j2π3n/8)? What does that say about them as vectors?", "courses": ["EE 120"]},
{"id": "orthogonal-expansion", "title": "orthogonal bases for signals", "folder": "signals", "essence": "When the basis signals are orthogonal to each other, each coefficient is found alone, by one inner product. There are no simultaneous equations to solve.", "check": "You expand a signal in a basis that is not orthogonal. What goes wrong when you try to find one coefficient by projecting?", "courses": ["EE 120"]},
{"id": "correlation", "title": "correlation", "folder": "signals", "essence": "Slide one signal past another and take the inner product at each shift. A peak in the result says: here is where the two line up.", "check": "A radar sends a pulse and receives a noisy, delayed copy. Where does the correlation of the two peak, and what does that position tell you?", "courses": ["EE 120"], "later": [{"course": "EE 121", "how": "A matched filter correlates what was received with the pulse it expects."}, {"course": "EECS 126", "how": "The autocorrelation describes a random process, and its transform is the power spectrum."}]},
{"id": "amplitude-modulation", "title": "amplitude modulation", "folder": "signals", "essence": "Multiply a message by a carrier cos(ω_c t) and its spectrum moves from around zero to around ±ω_c, where an antenna or a shared cable can carry it.", "check": "A message 4 kHz wide is modulated onto a 100 kHz carrier. Which band of frequencies does the result occupy?", "courses": ["EE 120"], "later": [{"course": "EE 121", "how": "Digital communication moves a stream of symbols up to a carrier in the same way."}]},
{"id": "synchronous-demodulation", "title": "synchronous demodulation", "folder": "signals", "essence": "Multiply the received signal by the same carrier again and low-pass filter: one copy of the message lands back at zero frequency. A phase error φ in the local carrier scales the result by cos φ.", "check": "The receiver's carrier is 90° out of phase with the transmitter's. What comes out of the demodulator?", "courses": ["EE 120"]},
{"id": "quadrature-modulation", "title": "quadrature modulation", "folder": "signals", "essence": "A cosine carrier and a sine carrier at the same frequency are orthogonal, so two messages can share one band and still be separated.", "check": "Two messages ride on cosine and sine carriers of the same frequency. What does the receiver multiply by to get each one alone, and what must be accurate for that to work?", "courses": ["EE 120"], "later": [{"course": "EE 121", "how": "QAM sends two symbol streams at once on cosine and sine carriers."}, {"course": "EE 142", "how": "The I and Q mixers of a radio front end are this multiplication, built from transistors."}]},
{"id": "frequency-division-multiplexing", "title": "frequency-division multiplexing", "folder": "signals", "essence": "Give each message its own carrier frequency and the spectra sit side by side without overlapping. A band-pass filter picks one out.", "check": "Ten messages, each 4 kHz wide, share a cable using ordinary AM. What is the least total bandwidth they need?", "courses": ["EE 120"]},
{"id": "loop-gain", "title": "loop gain", "folder": "systems/control", "essence": "Break the feedback loop, inject a signal and see what comes back around: the loop gain T. Feedback divides errors, distortion and gain drift by 1 + T, so its benefits last only at frequencies where |T| is large.", "check": "An op-amp with open-loop gain 10⁴ is wired as a non-inverting amplifier that feeds back a tenth of the output. What is T, and how much does a 10% drop in open-loop gain change the closed-loop gain?", "courses": ["EE 105"], "plan": "plans/loop-gain.md", "plan_status": "stub"},
{"id": "gain-bandwidth-product", "title": "gain-bandwidth trade", "folder": "systems/control", "essence": "Wrap feedback round a single-pole amplifier and the gain falls by 1 + T while the bandwidth rises by 1 + T. Their product stays at the unity-gain frequency, so every decade of closed-loop gain costs a decade of bandwidth.", "check": "An op-amp's gain falls to 1 at 10 MHz. You build a non-inverting amplifier with a gain of 100. What bandwidth do you expect, and what happens if you lower the gain to 10?", "courses": ["EE 105"], "plan": "plans/loop-gain.md", "plan_status": "stub"},
{"id": "phase-margin", "title": "phase margin", "folder": "systems/control", "essence": "Negative feedback turns positive if the loop delays the signal by 180° while |T| is still 1 or more. Phase margin is how far the loop's phase is from −180° where |T| = 1. A small margin means ringing; none means oscillation.", "check": "A loop gain has one pole far below crossover and a second pole exactly at the frequency where |T| = 1. What is the phase margin, and what does the closed-loop step response look like?", "courses": ["EE 105"], "plan": "plans/loop-gain.md", "plan_status": "stub"},
{"id": "frequency-response", "title": "frequency response", "folder": "systems", "essence": "An LTI system can only scale a sinusoid and shift it in time. H(jω) says by how much at each frequency.", "check": "A sinusoid at 1 kHz goes into an LTI system. Which frequencies can come out, and which two numbers describe the change?", "courses": ["EE 120", "EE 105"], "later": [{"course": "EE 140", "how": "An amplifier's gain is a function of frequency, and its bandwidth is where that gain falls."}]},
{"id": "system-linearity", "title": "linearity", "folder": "systems", "essence": "Scale the input and the output scales by the same factor. Add two inputs and the outputs add. This is what lets a complicated input be handled one piece at a time.", "check": "Is y(t) = x(t) + 1 linear? Test it with the input that is zero everywhere.", "courses": ["EE 120", "EE 105"]},
{"id": "time-invariance", "title": "time invariance", "folder": "systems", "essence": "Delay the input and the output is the same shape, delayed by the same amount. The system has no clock of its own.", "check": "Is y(t) = x(2t) time-invariant? Delay the input by 1 s and compare with delaying the output by 1 s.", "courses": ["EE 120"]},
{"id": "causality", "title": "causality", "folder": "systems", "essence": "A causal system's output depends only on the input now and earlier. For an LTI system that means the impulse response is zero before t = 0.", "check": "A system averages each sample with the one after it. Is it causal? What one change would make it causal?", "courses": ["EE 120"]},
{"id": "bibo-stability", "title": "BIBO stability", "folder": "systems", "essence": "A stable system gives a bounded output for every bounded input. For an LTI system that happens exactly when the total area under |h| is finite.", "check": "An integrator has h(t) = 1 for t ≥ 0. Find a bounded input that makes its output grow without limit.", "courses": ["EE 120"]},
{"id": "invertibility", "title": "invertibility", "folder": "systems", "essence": "A system is invertible when different inputs always give different outputs, so the input can be recovered. An LTI system loses a frequency for good wherever its frequency response is zero.", "check": "A two-point averager y[n] = (x[n] + x[n − 1])/2 removes one frequency completely. Which one, and why can no second system bring it back?", "courses": ["EE 120"]},
{"id": "impulse-response", "title": "impulse response", "folder": "systems", "essence": "The impulse response h is what comes out when a unit impulse goes in. For an LTI system it is the whole story: every output is built from shifted, scaled copies of h.", "check": "h[n] is 1 for n = 0, 1, 2 and zero elsewhere. Without computing a convolution, say in words what the system does to its input.", "courses": ["EE 120", "EE 105"]},
{"id": "convolution", "title": "convolution", "folder": "systems", "essence": "Flip one signal, slide it across the other, and at each shift record the area of their overlap. The output of an LTI system is its input convolved with h.", "check": "A 2 s wide pulse is convolved with a 5 s wide pulse. How wide is the result, what is its shape, and for how long is it flat?", "courses": ["EE 120", "EE 105"], "later": [{"course": "EE 123", "how": "Designing an FIR filter is choosing the impulse response that the signal is convolved with."}]},
{"id": "convolution-properties", "title": "properties of convolution", "folder": "systems", "essence": "The order does not matter, and a cascade of two systems is one system whose impulse response is h₁ ∗ h₂. Convolving with a shifted impulse just shifts.", "check": "Two LTI systems are connected one after the other. Does swapping them change the output? What does that say about convolution?", "courses": ["EE 120"]},
{"id": "step-response", "title": "step response", "folder": "systems", "essence": "The step response is the output for a unit step: the running integral of h. Where it settles is the system's gain for a constant input.", "check": "A system's impulse response has total area 3. Where does its step response settle?", "tools": ["systems/rc-rl-step-response.html"], "courses": ["EE 120", "EE 105"]},
{"id": "difference-equations", "title": "difference equations", "folder": "systems", "essence": "A difference equation computes each output sample from recent inputs and past outputs. Started from rest, it is an LTI system that you can run by hand, one step at a time.", "check": "y[n] = 0.5 y[n − 1] + x[n], started from rest. What are the first four samples of its impulse response?", "courses": ["EE 120"]},
{"id": "differential-equations-lti", "title": "differential equations as systems", "folder": "systems", "essence": "A circuit or a mass on a spring obeys a linear differential equation with constant coefficients. Started from rest, that equation is an LTI system, and the roots of its characteristic equation are the frequencies the system rings at by itself.", "check": "The characteristic roots of a system are −1 ± j5 per second. With no input, what does its response look like, and how long does it last?", "courses": ["EE 120"]},
{"id": "fir-iir", "title": "FIR and IIR", "folder": "systems", "essence": "With no feedback, the impulse response ends after a few samples: finite impulse response. With feedback of past outputs, it rings on forever: infinite impulse response.", "check": "y[n] = x[n] − x[n − 3] and y[n] = 0.9 y[n − 1] + x[n]. Which is FIR, which is IIR, and which one could become unstable if a coefficient changed?", "courses": ["EE 120"]},
{"id": "block-diagrams", "title": "block diagrams", "folder": "systems", "essence": "Delays or integrators, gains and adders wired together are a picture of the equation. Each feedback path is a past output being used again.", "check": "A diagram has two delays in a row with a path from each delay's output back to the input adder. What is the order of the difference equation?", "courses": ["EE 120"]},
{"id": "magnitude-and-phase", "title": "magnitude and phase", "folder": "systems", "essence": "A real sinusoid goes in and the same frequency comes out: its amplitude multiplied by |H|, its phase advanced by the angle of H. For a real system H at −ω is the conjugate of H at ω, which keeps the output real.", "check": "H(jω) = 1/(1 + jω). A cosine at ω = 1 rad/s with amplitude 2 goes in. What are the amplitude and the phase of the output?", "courses": ["EE 120"]},
{"id": "dt-frequency-response", "title": "frequency response in discrete time", "folder": "systems", "essence": "In discrete time the frequency response repeats every 2π in ω. Only −π to π matters: ω = 0 is a constant and ω = π is the fastest alternation.", "check": "A filter has H = 1 at ω = 0 and H = 0 at ω = π. What does it do to a constant sequence, and to +1, −1, +1, −1?", "courses": ["EE 120"]},
{"id": "ideal-filters", "title": "ideal filters", "folder": "systems", "essence": "An ideal low-pass filter keeps every frequency below its cutoff untouched and removes every one above. Its impulse response is a sinc that starts before t = 0, so it can only be approximated.", "check": "Why can an ideal low-pass filter not be built as a causal system? What is given up in every real approximation?", "courses": ["EE 120"]},
{"id": "filter-types", "title": "low-pass, high-pass, band-pass, notch", "folder": "systems", "essence": "A filter is named for what its magnitude response does: which frequencies pass and which are stopped. Averaging neighbours smooths, which is low-pass. Differencing neighbours sharpens, which is high-pass.", "check": "y[n] = x[n] − x[n − 1]. Without any algebra, is this low-pass or high-pass? What does it do to a constant input?", "courses": ["EE 120"]},
{"id": "first-order-system", "title": "first-order systems", "folder": "systems", "essence": "One energy store gives one pole and one time constant τ. The step response covers 63% of what is left every τ seconds, and the gain starts to fall near ω = 1/τ.", "check": "A first-order system's time constant is halved. What happens to how fast its step response settles, and to where its gain begins to fall?", "tools": ["systems/rc-rl-step-response.html"], "courses": ["EE 120", "EE 105"]},
{"id": "second-order-system", "title": "second-order systems", "folder": "systems", "essence": "Two energy stores trade energy back and forth. The natural frequency ω₀ sets how fast, and the damping ratio ζ sets whether the response rings (ζ < 1) or creeps (ζ > 1).", "check": "The damping of a second-order system is reduced while ω₀ stays the same. What changes in its step response, and what changes in its frequency response?", "courses": ["EE 120"], "later": [{"course": "EE 128", "how": "Step-response specifications are stated as the ω₀ and ζ of the dominant pair of poles."}]},
{"id": "resonance", "title": "resonance", "folder": "systems", "essence": "Drive a lightly damped system near its natural frequency and each push arrives in step with the motion, so the response builds up. The peak gain is about Q times the low-frequency gain.", "check": "A system has Q = 20. Roughly how much larger is its response at resonance than at low frequency, and how narrow is the peak?", "courses": ["EE 120", "EE 105"], "later": [{"course": "EE 142", "how": "Tuned LC loads and matching networks select a band by resonance."}]},
{"id": "linear-phase", "title": "linear phase is delay", "folder": "systems", "essence": "A phase that falls in a straight line with frequency delays every frequency by the same time, so the shape of the signal survives. The slope of the phase is the delay.", "check": "A filter's phase is −3ω for all ω (discrete time). What does it do to the shape of a pulse, and by how many samples?", "courses": ["EE 120"]},
{"id": "all-pass", "title": "all-pass systems", "folder": "systems", "essence": "An all-pass system leaves every magnitude alone and changes only the phase. Each of its poles is matched by a zero at the mirror-image point.", "check": "If an all-pass system passes every frequency at full strength, how can its output look different from its input?", "courses": ["EE 120"]},
{"id": "feedback", "title": "feedback", "folder": "systems", "essence": "Feed a fraction of the output back and subtract it from the input: the closed-loop gain is G/(1 + GH). When the loop gain GH is large, the result is close to 1/H, whatever G is.", "check": "An amplifier with gain 1000 is put in a loop with H = 0.1. What is the closed-loop gain? What is it if the amplifier's gain drops to 500?", "tools": ["circuits/amplifiers/ideal-op-amp.html"], "courses": ["EE 120", "EE 105"], "later": [{"course": "EE 140", "how": "Every op-amp circuit trades open-loop gain for accuracy, bandwidth and impedance through this loop."}, {"course": "EE 128", "how": "State feedback and observers are feedback designed on the state-space model."}]},
{"id": "transfer-function", "title": "transfer function", "folder": "systems", "essence": "With the system at rest beforehand, H(s) is the ratio of the output's transform to the input's: a ratio of two polynomials that can be read straight off the differential equation.", "check": "y″ + 3y′ + 2y = x′. Write H(s) without solving anything. Where are its poles and its zero?", "tools": ["systems/bode-plot.html"], "courses": ["EE 120", "EE 105"]},
{"id": "laplace-transform", "title": "Laplace transform", "folder": "systems", "essence": "The Laplace transform writes a signal as a sum of phasors e^(st) that grow or decay as they turn. X(s) says how much of each is in the signal. The jω axis is the special case of no growth.", "check": "Why can the Laplace transform describe e^(2t) switched on at t = 0, when the Fourier transform cannot?", "courses": ["EE 120", "EE 105"]},
{"id": "region-of-convergence", "title": "region of convergence", "folder": "systems", "essence": "The region of convergence is the set of s (or z) for which the transform's sum settles. It carries what the formula alone cannot say: whether the signal runs forwards or backwards in time, and whether the system is stable.", "check": "Two different signals share the transform 1/(s + 1). What distinguishes them, and which one decays?", "courses": ["EE 120"]},
{"id": "poles-and-zeros", "title": "poles and zeros", "folder": "systems", "essence": "A pole is a value of s where H blows up, and it is a natural response the system can produce by itself. A zero is a value of s where H vanishes, an input e^(st) that the system blocks completely.", "check": "A system has a zero at s = j10 rad/s. What happens to a 10 rad/s sinusoid that goes in?", "tools": ["systems/bode-plot.html"], "courses": ["EE 120", "EE 105"], "later": [{"course": "EE 140", "how": "Whether an amplifier in a loop is stable is read from where its poles sit."}]},
{"id": "pole-zero-geometry", "title": "frequency response from the pole-zero plot", "folder": "systems", "essence": "Walk a point up the jω axis. The magnitude of H there is the product of the distances to the zeros divided by the product of the distances to the poles. A pole close to the axis makes a peak.", "check": "A pole sits at −0.1 + j5. Near which frequency does the gain peak, and why is the peak tall and narrow?", "courses": ["EE 120"]},
{"id": "stability-from-poles", "title": "stability from poles", "folder": "systems", "essence": "A causal LTI system is stable exactly when every pole lies in the left half of the s-plane, or inside the unit circle of the z-plane. Each pole's position is the decay rate of one natural response.", "check": "A causal system has poles at −2 and +0.5 per second. Is it stable? Which pole decides, and what does its natural response do?", "courses": ["EE 120"]},
{"id": "inverse-by-partial-fractions", "title": "inverse transforms by partial fractions", "folder": "systems", "essence": "Split a rational transform into one-pole pieces. Each piece is one exponential, and the region of convergence says whether it runs forwards or backwards in time.", "check": "H(s) = 1/((s + 1)(s + 2)) for a causal system. Without finishing the algebra, what two exponentials make up h(t)?", "courses": ["EE 120"]},
{"id": "zero-input-zero-state", "title": "zero-input and zero-state response", "folder": "systems", "essence": "The total response is two parts added: what the stored energy does with no input, and what the input does starting from rest. Only the second part is linear in the input.", "check": "A charged capacitor is connected to a source through a resistor. Which part of the response would still be there if the source were zero?", "courses": ["EE 120"]},
{"id": "z-transform", "title": "z-transform", "folder": "systems", "essence": "The z-transform is the discrete-time counterpart of the Laplace transform: X(z) = Σ x[n] z^(−n). Multiplying by z^(−1) is a delay of one sample, and the unit circle plays the part of the jω axis.", "check": "What does multiplying a transform by z^(−2) do to the sequence? Where on the z-plane do you read off the frequency response?", "courses": ["EE 120"], "later": [{"course": "EE 123", "how": "Digital filters are designed by placing poles and zeros in the z-plane."}]},
{"id": "state-space-model", "title": "state-space model", "folder": "systems", "essence": "The state is the smallest set of numbers that, with the input from now on, fixes the future. The model is ẋ = Ax + Bu, y = Cx + Du (or x[n + 1] = Ax[n] + Bu[n]).", "check": "A circuit has two capacitors and one inductor, all independent. How many state variables does it need, and what is a natural choice for them?", "courses": ["EE 120"], "later": [{"course": "EE 128", "how": "Every design method in the course starts from this model."}, {"course": "EECS C106A", "how": "A robot's dynamics are written and linearised in state-space form."}]},
{"id": "state-modes", "title": "modes of a state-space system", "folder": "systems", "essence": "Start the state along an eigenvector of A and it stays on that line, scaling by e^(λt). Every free response is a sum of such modes, one per eigenvector.", "check": "A has eigenvalues −1 and −10 per second. The state starts on the eigenvector of −10. What does the trajectory look like, and how long does it last?", "courses": ["EE 120"]},
{"id": "internal-stability", "title": "internal stability", "folder": "systems", "essence": "Every eigenvalue of A has a negative real part (or lies inside the unit circle), so every state decays from any start. This is stricter than BIBO stability: an unstable mode can hide by cancelling out of the transfer function.", "check": "A system's transfer function is 1/(s + 1), but its A matrix also has an eigenvalue at +2. Is it BIBO stable? Is it internally stable? What could go wrong?", "courses": ["EE 120"]},
{"id": "state-space-to-transfer-function", "title": "from state space to transfer function", "folder": "systems", "essence": "H(s) = C(sI − A)⁻¹B + D. Every pole of H is an eigenvalue of A. An eigenvalue that cancels is a mode the input cannot excite or the output cannot see.", "check": "A has eigenvalues −1 and −3 but H(s) has a pole only at −1. What happened to the mode at −3?", "courses": ["EE 120"]},
{"id": "bode-plot", "title": "Bode plot", "folder": "systems", "essence": "On log axes each pole bends |H| down by 20 dB per decade, and each zero bends it up, from its corner frequency on. Draw the straight lines and add them. The phase of each moves by 90°, spread over the two decades around its corner.", "check": "H(s) has poles at 100 rad/s and 10 krad/s and nothing else. What is the slope of |H| at 1 krad/s and above 100 krad/s, and roughly what is the phase at 1 krad/s?", "tools": ["systems/bode-plot.html"], "courses": ["EE 120", "EE 105"]},
{"id": "dominant-pole", "title": "dominant pole", "folder": "systems", "essence": "When one pole sits far below all the others, it alone sets the bandwidth, and the system acts first-order until well past that corner. The other poles matter only for phase, near where the gain has already fallen.", "check": "An amplifier has poles at 1 Mrad/s and 100 Mrad/s. Estimate its −3 dB bandwidth. What happens to that estimate if the second pole moves down to 2 Mrad/s?", "courses": ["EE 105"]},
{"id": "rhp-zero", "title": "right-half-plane zero", "folder": "systems", "essence": "A zero at s = +z raises the magnitude just as a zero at −z does, but its phase goes the wrong way: it lags, like a pole. It appears when a signal sneaks forward through a side path and arrives with the opposite sign to the main one.", "check": "A common-source stage has a zero at +g_m/C_gd. Far above that frequency, how does the phase compare with what the poles alone predict?", "courses": ["EE 105"]}
],

{"from": "depletion-region", "to": "built-in-potential", "why": "The bare charge of the depletion region is what holds up the potential step."},

{"from": "built-in-potential", "to": "depletion-width", "why": "The total potential across the region sets the width, as its square root."},

{"from": "diffusion-current", "to": "minority-carrier-diffusion", "why": "With no field in the neutral region, the minority current is pure diffusion, set by the slope."},
{"from": "recombination-and-lifetime", "to": "minority-carrier-diffusion", "why": "The lifetime sets how far carriers get before they recombine: L = √(Dτ)."},

{"from": "minority-carrier-diffusion", "to": "diffusion-capacitance", "why": "The area under the minority profile is the stored charge, and it scales with the current."},

{"from": "minority-carrier-diffusion", "to": "photodiode-solar-cell", "why": "Only carriers born within about one diffusion length of the junction are collected."},
{"from": "electrons-and-holes", "to": "intrinsic-carriers", "why": "Each broken bond makes one electron and one hole, which is why n = p in pure silicon."},

{"from": "energy-bands", "to": "electrons-and-holes", "why": "An empty state in a nearly full valence band is what moves as a hole."},

{"from": "mass-action-law", "to": "doping", "why": "Doping sets the majority density, and np = n_i² then fixes the minority density."},

{"from": "doping", "to": "mobility", "why": "Ionized dopants are charged obstacles, so more doping means more scattering and lower mobility."},

{"from": "ohms-law", "to": "drift-current", "why": "J = σE is Ohm's law written per unit area and per unit length."},

{"from": "mass-action-law", "to": "resistivity", "why": "np = n_i² makes the minority density so small that only the majority term in σ counts."},

{"from": "mass-action-law", "to": "recombination-and-lifetime", "why": "Recombination is the process that pulls np back to n_i² after it is disturbed."},
{"from": "first-order-system", "to": "recombination-and-lifetime", "why": "The excess decays at a rate proportional to itself, so it falls like any first-order system with time constant τ."},

{"from": "projection", "to": "fourier-series", "why": "A Fourier coefficient is a projection: how much of the signal lies along one harmonic."},

{"from": "periodicity", "to": "dtfs", "why": "Only a whole number of turns in N steps repeats, which leaves exactly N distinct harmonics."},

{"from": "dt-frequency", "to": "dtft", "why": "A sequence cannot tell ω from ω + 2π, so its spectrum repeats every 2π."},
{"from": "fourier-transform", "to": "ft-time-shift", "why": "A delay multiplies every phasor e^(jωt) by e^(−jωt₀)."},
{"from": "fourier-transform", "to": "ft-frequency-shift", "why": "Multiplying by e^(jω₀t) adds ω₀ to the frequency of every phasor in the signal."},

{"from": "fourier-transform", "to": "ft-multiplication-property", "why": "It is the convolution property with the roles of time and frequency exchanged."},
{"from": "ft-duality", "to": "ft-multiplication-property", "why": "Duality turns \"convolution in time is multiplication in frequency\" round."},
{"from": "fourier-transform", "to": "ft-duality", "why": "The forward and inverse integrals differ only by a sign and a constant."},
{"from": "fourier-transform", "to": "time-bandwidth", "why": "Compressing the time axis by a stretches the frequency axis by a."},

{"from": "fourier-transform", "to": "ft-differentiation", "why": "Differentiating e^(jωt) brings down a factor of jω."},
{"from": "fourier-transform", "to": "rect-and-sinc", "why": "The rectangle is the first transform worth knowing by heart, and almost every other pair is built from it."},
{"from": "fourier-series", "to": "spectrum-of-periodic-signals", "why": "The series coefficients become the weights of impulses at the harmonics."},
{"from": "impulse-train", "to": "spectrum-of-periodic-signals", "why": "A periodic signal is one period convolved with an impulse train, so its spectrum is the period's spectrum sampled."},

{"from": "ft-multiplication-property", "to": "windowing", "why": "Multiplying by a window convolves the spectrum with the window's transform."},

{"from": "windowing", "to": "dft", "why": "Taking N samples is windowing, so every DFT shows a smeared spectrum."},
{"from": "fourier-transform", "to": "fourier-transform-2d", "why": "The same decomposition, with a wave vector in place of a single frequency."},

{"from": "ft-multiplication-property", "to": "sampling-theorem", "why": "Multiplying in time by the sampling train is convolving in frequency, which makes the copies."},
{"from": "sampling-theorem", "to": "aliasing", "why": "Aliasing is what the overlapping copies do."},
{"from": "dt-frequency", "to": "aliasing", "why": "Seen from the samples, a frequency and its alias are the same sequence."},
{"from": "sampling-theorem", "to": "reconstruction", "why": "If the copies do not overlap, a low-pass filter can keep one of them."},

{"from": "rect-and-sinc", "to": "reconstruction", "why": "That filter's impulse response is the sinc placed on each sample."},
{"from": "reconstruction", "to": "zero-order-hold", "why": "Holding each sample is the crude interpolation that real converters use in place of the sinc."},
{"from": "sampling-theorem", "to": "dt-processing-of-ct", "why": "With no aliasing, the samples carry the whole signal, so filtering the samples filters the signal."},
{"from": "dt-frequency-response", "to": "dt-processing-of-ct", "why": "The digital filter's response becomes the response of the whole chain."},
{"from": "aliasing", "to": "downsampling", "why": "Keeping every Mth sample is sampling again, and it aliases for the same reason."},

{"from": "dtft", "to": "upsampling", "why": "Inserting zeros squeezes the DTFT by M."},

{"from": "periodicity", "to": "dt-frequency", "why": "The same counting of turns per step that decides whether a sequence repeats also decides which frequencies are distinct."},
{"from": "dot-product", "to": "signal-inner-product", "why": "The inner product of two signals is the dot product with one coordinate per sample, and a conjugate on the second signal."},

{"from": "amplitude-modulation", "to": "synchronous-demodulation", "why": "Shifting again by the same frequency puts one copy back at zero and another at twice the carrier."},

{"from": "state-space-model", "to": "state-modes", "why": "The free response ẋ = Ax splits into one mode per eigenvector of A."},
{"from": "state-modes", "to": "internal-stability", "why": "Every mode decays exactly when every eigenvalue has a negative real part."},
{"from": "bibo-stability", "to": "internal-stability", "why": "Internal stability implies BIBO stability, but not the other way round."},
{"from": "state-space-model", "to": "state-space-to-transfer-function", "why": "Transforming the state equations and eliminating the state gives H(s)."},
{"from": "poles-and-zeros", "to": "state-space-to-transfer-function", "why": "The poles of H are among the eigenvalues of A."},
{"from": "rect-and-sinc", "to": "ideal-filters", "why": "The ideal low-pass filter is a rectangle in frequency, so its impulse response is a sinc."},
{"from": "poles-and-zeros", "to": "bode-plot", "why": "Each pole and each zero is one straight-line piece, and the plot is their sum in dB."},
{"from": "magnitude-and-phase", "to": "bode-plot", "why": "Logarithms turn the product of factors in |H| into a sum, so each factor is drawn on its own."},
{"from": "first-order-system", "to": "bode-plot", "why": "A single pole is the basic piece: flat, then −20 dB per decade after ω = 1/τ, with −45° at the corner."},
{"from": "first-order-system", "to": "dominant-pole", "why": "Below the other poles the system's response is that of one pole and one time constant."},
{"from": "bode-plot", "to": "dominant-pole", "why": "On the plot, the first corner is the bandwidth when the next one is a decade or more away."},
{"from": "poles-and-zeros", "to": "rhp-zero", "why": "It is an ordinary zero placed in the right half of the s-plane."},
{"from": "bode-plot", "to": "rhp-zero", "why": "Its magnitude line is drawn like any zero's; only its phase line flips sign."},
{"from": "common-source", "to": "rhp-zero", "why": "In a common-source stage C_gd carries the input straight to the output with the wrong sign, which puts a zero at +g_m/C_gd."}
]}

<script>
/*
  Reads the data block above and draws it:

    folders -> circles, nested for subfolders. The tree is built from each topic's `folder` path.
    topics  -> text, placed inside the circle of the folder they live in
    links   -> hairlines between topics

  The layout is a small physics run with a fixed starting point, so the same data always
  gives the same picture. Linked topics pull toward each other, folders stay compact, and
  nothing is allowed to overlap.

  No dependencies, no fetch, no modules: this has to work when the file is opened from disk.
*/
(function () {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const XLINK = "http://www.w3.org/1999/xlink";
  const TAU = Math.PI * 2;

  const svg = document.getElementById("map");
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panel-body");
  const input = document.getElementById("q");
  const results = document.getElementById("results");

  function fail(message) {
    const p = document.createElement("p");
    p.className = "fail";
    p.textContent = message;
    document.body.appendChild(p);
  }

  let data;
  try {
    data = JSON.parse(document.getElementById("map-data").textContent);
  } catch (err) {
    fail("The map data at the top of index.html is not valid JSON: " + err.message);
    return;
  }
  if (!data || !Array.isArray(data.topics)) {
    fail("The map data at the top of index.html has no \"topics\" list.");
    return;
  }

  // a short fingerprint of the data, so that a kept arrangement is thrown away when the map changes
  const dataMark = (function (text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + "-" + text.length;
  })(document.getElementById("map-data").textContent);
  // the learner's levels, when learner/levels.js exists and could be loaded
  const learner = window.MOMENTOS_LEARNER && window.MOMENTOS_LEARNER.levels ? window.MOMENTOS_LEARNER : null;

  // ---------------------------------------------------------------- helpers

  function S(name, attrs, parent) {
    const el = document.createElementNS(NS, name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // e^(jθ) in the data becomes a real superscript on screen
  const rich = (s) => esc(s).replace(/\^\(([^()]+)\)/g, "<sup>$1</sup>");
  const plain = (s) => String(s).replace(/\^\(([^()]+)\)/g, "^$1");
  const toolName = (p) => p.split("/").pop().replace(/\.[a-z0-9]+$/i, "").replace(/-/g, " ");

  const canFollowLinks = /^(file|https?):$/.test(location.protocol);

  // ---------------------------------------------------------------- data -> tree

  const problems = [];
  const topics = [];
  const byId = new Map();

  data.topics.forEach((t) => {
    if (!t || !t.id || !t.title || !t.folder) { problems.push("topic without id, title or folder: " + JSON.stringify(t)); return; }
    if (byId.has(t.id)) { problems.push("duplicate topic id: " + t.id); return; }
    const leaf = { kind: "leaf", id: t.id, topic: t, built: Array.isArray(t.tools) && t.tools.length > 0, x: 0, y: 0, mass: 1, out: [], inn: [] };
    byId.set(t.id, leaf);
    topics.push(leaf);
  });

  const links = [];
  (data.links || []).forEach((l) => {
    const a = byId.get(l && l.from), b = byId.get(l && l.to);
    if (!a || !b || a === b) { problems.push("link with an unknown or repeated end: " + (l && l.from) + " -> " + (l && l.to)); return; }
    const link = { a, b, why: l.why || "" };
    a.out.push(link);
    b.inn.push(link);
    links.push(link);

  const root = { kind: "group", name: "", path: "", parent: null, depth: 0, children: [], x: 0, y: 0, R: 0 };
  const groups = new Map([["", root]]);
  function groupFor(path) {
    if (groups.has(path)) return groups.get(path);
    const cut = path.lastIndexOf("/");
    const parent = groupFor(cut < 0 ? "" : path.slice(0, cut));
    const g = { kind: "group", name: cut < 0 ? path : path.slice(cut + 1), path, parent, depth: parent.depth + 1, children: [], x: 0, y: 0, R: 0 };
    parent.children.push(g);
    groups.set(path, g);
    return g;
  }
  topics.forEach((leaf) => {
    const g = groupFor(leaf.topic.folder.replace(/^\/+|\/+$/g, ""));
    leaf.parent = g;
    g.children.push(leaf);
  });
  (function weigh(n) {
    if (n.kind === "group") n.mass = n.children.reduce((s, c) => s + weigh(c), 0);
    return n.mass;
  })(root);

  // For each link, the two branches that hang off the lowest folder both ends share.
  function lineage(n) { const p = []; for (let k = n; k; k = k.parent) p.unshift(k); return p; }
  links.forEach((l) => {
    const pa = lineage(l.a), pb = lineage(l.b);
    let i = 0;
    while (pa[i + 1] === pb[i + 1]) i++;
    l.ga = pa[i + 1];
    l.gb = pb[i + 1];
  });

  // ---------------------------------------------------------------- svg scaffolding

  const defs = S("defs", {}, svg);
  const arrow = S("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9.5, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto", markerUnits: "userSpaceOnUse" }, defs);
  S("path", { d: "M1 1.5 L9.5 5 L1 8.5 z", class: "arrowhead" }, arrow);

  const world = S("g", {}, svg);
  const layerFolders = S("g", {}, world);
  const layerLinks = S("g", {}, world);
  const layerHalos = S("g", { "aria-hidden": "true" }, world);
  const layerNames = S("g", {}, world);
  const layerTopics = S("g", {}, world);

  const leafOf = new WeakMap();
  const groupOf = new WeakMap();

  topics.forEach((leaf) => {
    const g = S("g", { class: "topic" + (leaf.built ? "" : " planned"), tabindex: 0, role: "button" }, layerTopics);
    g.setAttribute("aria-label", plain(leaf.topic.title) + ", in " + leaf.topic.folder + (leaf.built ? ", has a tool" : ", planned"));
    leaf.hit = S("rect", { class: "hit" }, g);
    leaf.dot = S("circle", { class: "dot", r: 3 }, g);
    leaf.pip = S("circle", { class: "pip", r: 3.2 }, g);
    const text = S("text", { "text-anchor": "middle", dy: "0.34em" }, g);
    text.textContent = plain(leaf.topic.title);
    let box = { width: 0, height: 0 };
    try { box = text.getBBox(); } catch (_) { /* not rendered yet: fall through to the estimate */ }
    leaf.w = box.width || leaf.topic.title.length * 7.6;
    leaf.h = box.height || 19;
    // collision shape: a horizontal capsule around the words
    leaf.r = leaf.h / 2 + 13;
    leaf.hl = Math.max(0, leaf.w / 2 + 15 - leaf.r);
    leaf.pip.setAttribute("cx", (-leaf.w / 2 - 8).toFixed(1));
    if (learner) {

      g.classList.add("lv" + clamp(mine.level | 0, 0, 5));
      if (mine.due) g.classList.add("due");

    leafOf.set(g, leaf);
  });

  let arcCount = 0;
  groups.forEach((g) => {
    if (g === root) return;
